                    trigger: 'item',
                    triggerOn: window.innerWidth <= 768 ? 'click' : 'mousemove|click',
                    backgroundColor: 'rgba(26, 26, 32, 0.95)',
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    textStyle: { color: '#f1f2f6', fontFamily: 'inherit' }
                },
                dataZoom: [
                    { type: 'inside', xAxisIndex: 0, filterMode: 'none', startValue: viewMin, endValue: viewMax }, 
                    { type: 'inside', yAxisIndex: 0, filterMode: 'none' }, 
                    { type: 'slider', xAxisIndex: 0, top: 15, height: 20, borderColor: '#26262b', textStyle: { color: '#fff' } },
                    { type: 'slider', yAxisIndex: 0, filterMode: 'none', right: 15, width: 20, borderColor: '#26262b', textStyle: { color: '#fff' } }
                ],
                grid: { top: 60, right: 55, bottom: 80, left: 80 },
                xAxis: {
                    type: 'time',
                    min: new Date(`${dateStr}T00:00:00+08:00`).getTime(),
                    max: new Date(`${dateStr}T00:00:00+08:00`).getTime() + 25 * 3600 * 1000,
                    position: 'top', // 時間軸顯示在上方
                    interval: 5 * 60 * 1000, // 強制每 5 分鐘畫一條垂直線
                    splitLine: { show: true, lineStyle: { color: 'rgba(255, 255, 255, 0.15)' } }, 
                    axisLabel: { formatter: '{HH}:{mm}', color: '#a4b0be', hideOverlap: true }
                },
                yAxis: {
                    type: 'category',
                    data: yAxisData,
                    splitLine: { show: true, lineStyle: { color: 'rgba(255, 255, 255, 0.15)' } },
                    axisLabel: { color: '#f1f2f6', fontSize: 13, fontWeight: 'bold', interval: 0 }
                },
                series: seriesData
            };

            myChart.setOption(option, true);
        };

        // 關閉側邊面板
        const closeSidePanel = () => {
            document.getElementById('side-panel').classList.remove('active');
            document.getElementById('train-search').value = '';
            renderChart(document.getElementById('date-picker').value);
        };

        const showTrainDetails = (trainNo) => {
            const train = globalTimetable.find(t => String(t.No) === String(trainNo));
            if (!train) return;

            const panel = document.getElementById('side-panel');
            const titleEl = document.getElementById('sp-title');
            const routeEl = document.getElementById('sp-route');
            const bodyEl = document.querySelector('.sp-body');
            const badgeEl = document.getElementById('sp-status-badge');
            
            const trainColor = getTrainColor(train.Type, train.No);
            const shortType = getShortTrainType(train.Type, train.No);
            
            // Header
            titleEl.innerHTML = `<span style="color:${trainColor}; font-family:'Outfit'; font-weight:800; font-size:24px;">${train.No}</span> <span style="font-size:18px;">${shortType}</span>`;
            routeEl.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${train.StartStation || train.Start} ➝ ${train.EndStation || train.Dest}`;

            // 狀態 Badge 判斷 (利用 State System)
            const status = getTrainStatus(train);
            let badgeHtml = '';
            if (status === 'suspended') badgeHtml = '<span style="background:rgba(255,255,255,0.1); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px;">停駛</span>';
            else if (status === 'on-time') badgeHtml = '<span style="background:rgba(46,213,115,0.15); color:#2ed573; padding:4px 8px; border-radius:6px; font-size:12px;">準點</span>';
            else badgeHtml = `<span style="background:rgba(255,71,87,0.15); color:#ff4757; padding:4px 8px; border-radius:6px; font-size:12px;">延誤 +${globalLiveMap[train.No]?.DelayTime || 0}分</span>`;
            if (badgeEl) badgeEl.innerHTML = badgeHtml;

            // Timeline 渲染準備
            const datePickerVal = document.getElementById('date-picker').value;
            const nowTime = Date.now();
            let firstStopTimeMins = null;
            let pastCount = 0;
            const totalCount = train.Stops.length;
            let timelineHtml = '';

            const calculateDelayedTimeStr = (baseTimeStr, delayMins) => {
                if (!baseTimeStr) return '';
                const ms = parseTimeToTimestamp(baseTimeStr, datePickerVal, firstStopTimeMins) + delayMins * 60000;
                const d = new Date(ms);
                return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            };

            train.Stops.forEach((stop, index) => {
                const arrStr = stop.Arr;
                const depStr = stop.Dep;
                const timeStrForCalc = depStr || arrStr;
                if (!timeStrForCalc) return;
                
                let displayTimeHtml = '';
                if (index === 0) {
                    displayTimeHtml = depStr;
                } else if (index === train.Stops.length - 1) {
                    displayTimeHtml = arrStr;
                } else if (arrStr === depStr) {
                    displayTimeHtml = arrStr;
                } else {
                    displayTimeHtml = `${arrStr}<br><span style="opacity: 0.5;">${depStr}</span>`;
                }

                const [h, m] = timeStrForCalc.split(':').map(Number);
                if (index === 0) firstStopTimeMins = h * 60 + m; 
                const timeVal = parseTimeToTimestamp(timeStrForCalc, datePickerVal, firstStopTimeMins);
                
                // 判斷是否為已駛過區間
                let isPast = timeVal <= nowTime;
                if (isPast) pastCount++;
                
                const delayedClass = (status.includes('delay') && !isPast) ? 'is-delayed' : '';
                const pastClass = isPast ? 'is-past' : '';
                
                let actualTimeStr = displayTimeHtml;
                if (status.includes('delay') && !isPast) {
                    const delayMins = globalLiveMap[train.No]?.DelayTime || 0;
                    if (displayTimeHtml.includes('<br>')) {
                        const delayedArr = calculateDelayedTimeStr(arrStr, delayMins);
                        const delayedDep = calculateDelayedTimeStr(depStr, delayMins);
                        actualTimeStr = `<div style="font-size:11px; opacity:0.7; text-decoration:line-through;">${arrStr}<br>${depStr}</div><div style="margin-top:2px">${delayedArr}</div><div style="opacity: 0.5;">${delayedDep}</div>`;
                    } else {
                        const delayedTime = calculateDelayedTimeStr(displayTimeHtml, delayMins);
                        actualTimeStr = `<div style="font-size:11px; opacity:0.7; text-decoration:line-through;">${displayTimeHtml}</div><div style="margin-top:2px">${delayedTime}</div>`;
                    }
                }

                timelineHtml += `
                    <div class="timeline-item ${pastClass} ${delayedClass}">
                        <div class="tl-time">${actualTimeStr}</div>
                        <div style="position:relative; display:flex; flex-direction:column; align-items:center;">
                            <div class="tl-dot"></div>
                            <div class="tl-line"></div>
                        </div>
                        <div class="tl-content">
                            <strong>${stop.Name}</strong>
                        </div>
                    </div>
                `;
            });

            // 處理進度條
            if (totalCount > 0) {
                const progressPercent = Math.round((pastCount / totalCount) * 100);
                const progressTextEl = document.getElementById('sp-progress-text');
                const progressBarEl = document.getElementById('sp-progress-bar');
                if (progressTextEl) progressTextEl.innerText = `${pastCount} / ${totalCount} 站`;
                if (progressBarEl) progressBarEl.style.width = `${progressPercent}%`;
            }

            bodyEl.innerHTML = timelineHtml;
            panel.classList.add('active');
        };

        let statsExpanded = false;
        const toggleStatsExpanded = () => {
            statsExpanded = !statsExpanded;
            document.getElementById('stats-expanded').style.display = statsExpanded ? 'flex' : 'none';
            document.getElementById('stats-chevron').style.transform = statsExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        const updateStatsDashboard = () => {
            if (!globalTimetable || globalTimetable.length === 0) return;
            
            let totalTrains = globalTimetable.length;
            let ontimeCount = 0;
            let delayCount = 0;
            let suspendedCount = 0;
            let totalDelayMins = 0;
            let maxDelayMins = 0;

            globalTimetable.forEach(train => {
                const live = globalLiveMap[train.No] || globalLiveMap[train.TrainInfo?.TrainNo];
                if (live && live.SuspendedFlag) {
                    suspendedCount++;
                } else if (live && live.DelayTime > 0) {
                    delayCount++;
                    totalDelayMins += live.DelayTime;
                    if (live.DelayTime > maxDelayMins) maxDelayMins = live.DelayTime;
                } else {
                    ontimeCount++;
                }
            });

            const ontimePct = totalTrains ? Math.round((ontimeCount / totalTrains) * 100) : 0;
            const delayPct = totalTrains ? Math.round((delayCount / totalTrains) * 100) : 0;
            const suspendedPct = totalTrains ? Math.round((suspendedCount / totalTrains) * 100) : 0;
            const avgDelay = delayCount ? (totalDelayMins / delayCount).toFixed(1) : 0;

            document.getElementById('stat-total').innerText = totalTrains;
            document.getElementById('stat-normal').innerText = ontimeCount;
            document.getElementById('stat-normal-rate').innerText = `${ontimePct}%`;
            document.getElementById('stat-delay').innerText = delayCount;
            document.getElementById('stat-delay-rate').innerText = `${delayPct}%`;
            document.getElementById('stat-suspended').innerText = suspendedCount;
            const suspendedRateEl = document.getElementById('stat-suspended-rate');
            if (suspendedRateEl) suspendedRateEl.innerText = `${suspendedPct}%`;
        };

        const showAlertsModal = () => {
            const modal = document.getElementById('alerts-modal-overlay');
            const box = document.getElementById('alerts-modal-box');
            modal.style.display = 'flex';
            // 簡單的 fade-in 動畫觸發
            setTimeout(() => {
                modal.style.opacity = '1';
                box.style.transform = 'scale(1)';
            }, 10);
        };

        const closeAlertsModal = () => {
            const modal = document.getElementById('alerts-modal-overlay');
            const box = document.getElementById('alerts-modal-box');
            modal.style.opacity = '0';
            box.style.transform = 'scale(0.95)';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        };

        const quickJump = (stationName) => {
            if (!globalTimetable || globalTimetable.length === 0) return;
            const index = yAxisData.findIndex(s => s === stationName);
            if (index !== -1) {
                const range = 8;
                let startValue = Math.max(0, index - range);
                let endValue = Math.min(yAxisData.length - 1, index + range);
                myChart.dispatchAction({ type: 'dataZoom', dataZoomIndex: 1, startValue: startValue, endValue: endValue });
                myChart.dispatchAction({ type: 'dataZoom', dataZoomIndex: 3, startValue: startValue, endValue: endValue });
            }
        };

        const updateAlertsMarquee = (alerts) => {
            const alertBar = document.getElementById('alert-bar');
            const alertCount = document.getElementById('alert-count');
            const alertIcon = document.getElementById('alert-icon-main');
            const marqueeText = document.getElementById('alerts-marquee-text');
            const modalBody = document.getElementById('alerts-modal-body');
            
            if (!alerts || alerts.length === 0) {
                alertBar.style.display = 'none';
                return;
            }
            
            const isAlertNormal = (a) => a.Title.includes('正常') || a.Title.includes('恢復');
            const abnormalAlerts = alerts.filter(a => !isAlertNormal(a));
            const isAllNormal = abnormalAlerts.length === 0;
            
            alertBar.style.display = 'flex';
            
            if (isAllNormal) {
                alertBar.style.background = 'rgba(46, 213, 115, 0.08)';
                alertBar.style.borderColor = 'rgba(46, 213, 115, 0.15)';
                alertIcon.innerText = '✅';
                alertCount.innerText = '全線正常';
                alertCount.style.color = 'var(--success)';
                marqueeText.innerHTML = '目前無重大營運通阻。';
            } else {
                alertBar.style.background = 'rgba(255, 71, 87, 0.08)';
                alertBar.style.borderColor = 'rgba(255, 71, 87, 0.15)';
                alertIcon.innerText = '⚠️';
                alertCount.innerText = `${abnormalAlerts.length} 項異常`;
                alertCount.style.color = 'var(--danger)';
                
                // 只顯示第一筆摘要
                const firstAlert = abnormalAlerts[0];
                marqueeText.innerHTML = `<span style="color:var(--danger)">[${firstAlert.Title}]</span> ${firstAlert.Description}`;
            }
            
            // 渲染 Modal 詳細清單
            modalBody.innerHTML = alerts.map(a => {
                const normal = isAlertNormal(a);
                const color = normal ? 'var(--success)' : 'var(--danger)';
                return `
                <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 8px; border-left: 3px solid ${color};">
                    <h4 style="margin: 0 0 8px 0; color: ${color};">${a.Title}</h4>
                    <p style="margin: 0; font-size: 14px; color: var(--text-secondary); line-height: 1.5;">${a.Description}</p>
                </div>`;
            }).join('');
        };

        // 設定每 60 秒的背景刷新定時器
        const startAutoRefresh = () => {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);

            autoRefreshTimer = setInterval(async () => {
                const datePicker = document.getElementById('date-picker');
                // 只有日期選定為「今天」時，才有即時位置與誤點更新的必要
                if (datePicker.value === getTwTodayString()) {
                    const statusEl = document.getElementById('loading-status');
                    try {
                        statusEl.classList.remove('success');
                        statusEl.style.opacity = '1';
                        statusEl.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                        statusEl.style.background = 'rgba(255, 165, 2, 0.1)';
                        statusEl.style.color = '#ffa502';
                        statusEl.innerHTML = `<i class="fas fa-sync fa-spin"></i> <span id="status-text">更新即時位置中...</span>`;
                        
                        const [liveRes, alertsRes] = await Promise.all([
                            fetch(`${API_BASE}/api/live`),
                            fetch(`${API_BASE}/api/alerts`)
                        ]);
                        const liveData = await liveRes.json();
                        globalLiveMap = {};
                        liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                        updateLastUpdateTime();
                        
                        try {
                            globalAlerts = await alertsRes.json();
                            updateAlertsMarquee(globalAlerts);
                        } catch(e) {}
                        
                        renderChart(datePicker.value);
                        
                        statusEl.classList.add('success');
                        statusEl.innerHTML = `<i class="fas fa-check"></i> 即時位置已更新`;
                        setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
                    } catch (e) {
                        console.error("每分鐘更新即時位置失敗:", e);
                        statusEl.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                        statusEl.style.background = 'rgba(255, 71, 87, 0.1)';
                        statusEl.style.color = '#ff4757';
                        statusEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> 位置更新失敗`;
                        setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
                    }
                }
            }, 60000); // 60 秒
        };

        // 從 API 下載資料並更新全域變數
        const loadData = async (dateStr) => {
            const statusEl = document.getElementById('loading-status');
            
            // 清除之前的自動更新定時器
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }

            // 隱藏先前的錯誤覆蓋層
            document.getElementById('error-overlay').style.display = 'none';

            try {
                myChart.clear(); 
                statusEl.classList.remove('success');
                statusEl.style.opacity = '1';
                statusEl.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                statusEl.style.background = 'rgba(255, 165, 2, 0.1)';
                statusEl.style.color = '#ffa502';
                statusEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span id="status-text">下載時刻表中...</span>`;
                
                const textEl = document.getElementById('status-text');

                // 1. 抓取該日時刻表
                const res = await fetch(`${API_BASE}/api/timetable/daily?date=${dateStr}`);
                if (!res.ok) throw new Error("無該日時刻表資料");
                globalTimetable = await res.json();
                
                // 2. 只有選擇「今天」才抓取即時誤點資料
                if (dateStr === getTwTodayString()) {
                    textEl.innerText = "抓取即時動態與通阻中...";
                    const [liveRes, alertsRes] = await Promise.all([
                        fetch(`${API_BASE}/api/live`),
                        fetch(`${API_BASE}/api/alerts`)
                    ]);
                    const liveData = await liveRes.json();
                    globalLiveMap = {};
                    liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                    updateLastUpdateTime();
                    try {
                        globalAlerts = await alertsRes.json();
                        updateAlertsMarquee(globalAlerts);
                    } catch(e) {}
                } else {
                    globalLiveMap = {}; 
                    document.getElementById('alerts-marquee').style.display = 'none';
                }

                // O(N) 預處理：擴展跨線節點並計算 Timestamp
                globalTimetable = globalTimetable.map(train => {
                    const expandedStops = [];
                    for (let i = 0; i < train.Stops.length; i++) {
                        expandedStops.push(train.Stops[i]);
                        if (i < train.Stops.length - 1) {
                            const stopA = train.Stops[i];
                            const stopB = train.Stops[i+1];
                            const nameA = stopA.Name.replace("-環島", "");
                            const nameB = stopB.Name.replace("-環島", "");
                            
                            const junctions = findJunctionsBetween(nameA, nameB);
                            if (junctions.length > 0) {
                                const virtualStops = interpolateJunctionStops(stopA, stopB, junctions);
                                expandedStops.push(...virtualStops);
                            }
                        }
                    }
                    
                    let firstStopTimeMins = null;
                    if (expandedStops.length > 0) {
                        const firstTimeStr = expandedStops[0].Dep || expandedStops[0].Arr;
                        if (firstTimeStr) {
                            const [h, m] = firstTimeStr.split(':').map(Number);
                            firstStopTimeMins = h * 60 + m;
                        }
                    }
                    
                    expandedStops.forEach(stop => {
                        stop.ArrTimeVal = stop.Arr ? parseTimeToTimestamp(stop.Arr, dateStr, firstStopTimeMins) : null;
                        stop.DepTimeVal = stop.Dep ? parseTimeToTimestamp(stop.Dep, dateStr, firstStopTimeMins) : null;
                    });
                    
                    return { ...train, Stops: expandedStops };
                });

                textEl.innerText = "渲染圖表中...";
                renderChart(dateStr);
                
                statusEl.classList.add('success');
                statusEl.innerHTML = `<i class="fas fa-check"></i> 載入完成 (共 ${globalTimetable.length} 班次)`;
                
                // 載入成功後，如果是今天，則重新啟動自動更新定時器
                if (dateStr === getTwTodayString()) {
                    startAutoRefresh();
                }

                setTimeout(() => { 
                    statusEl.style.opacity = '0'; 
                    statusEl.style.transition = 'opacity 1s'; 
                }, 3000);

            } catch (err) {
                console.error(err);
                globalTimetable = [];
                statusEl.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                statusEl.style.background = 'rgba(255, 71, 87, 0.1)';
                statusEl.style.color = '#ff4757';
                statusEl.innerHTML = `<i class="fas fa-times"></i> 載入失敗: ${escapeHtml(err.message)}`;
                // 顯示錯誤重試覆蓋層
                const errorOverlay = document.getElementById('error-overlay');
                document.getElementById('error-msg').textContent = err.message || '未知錯誤';
                errorOverlay.style.display = 'flex';
            }
        };

        // 綁定事件監聽器
        document.addEventListener('DOMContentLoaded', () => {
            const lineSelect = document.getElementById('line-select');
            const datePicker = document.getElementById('date-picker');
            const searchInput = document.getElementById('train-search');

            // 預設設定為今天
            const todayStr = getTwTodayString();
            datePicker.value = todayStr;
            
            // 限制日期選擇範圍為：今天至未來 60 天
            datePicker.min = todayStr;
            
            const todayDate = new Date(Date.now() + 8 * 3600000);
            const maxDate = new Date(todayDate);
            maxDate.setDate(todayDate.getDate() + 60);
            datePicker.max = maxDate.toISOString().split('T')[0];
            
            // 首次載入資料
            loadData(datePicker.value);

            // 當日期改變時，重新下載資料
            datePicker.addEventListener('change', (e) => {
                loadData(e.target.value);
            });

            // 當線路切換時，進行前端 0 延遲過濾與重繪
            lineSelect.addEventListener('change', () => {
                renderChart(datePicker.value);
            });

            // 當搜尋框內容改變時，連動重繪、開啟 Side Panel 與自動 Zoom
            let searchDebounceTimer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchDebounceTimer);
                const val = e.target.value.trim();
                
                // 立即顯示載入中樣式 (Optional)
                const loadingStatus = document.getElementById('loading-status');
                if(loadingStatus && val) loadingStatus.innerHTML = '搜尋中...';

                searchDebounceTimer = setTimeout(() => {
                    // 保留原有 ECharts 核心呼叫
                    renderChart(datePicker.value);
                    
                    if (val) {
                        // 自動開啟 Side Panel
                        showTrainDetails(val);
                    } else {
                        closeSidePanel(); // 清空時關閉面板
                    }
                }, 400); // 400ms debounce
            });

            const typeFilter = document.getElementById('type-filter');
            typeFilter.addEventListener('change', () => {
                renderChart(datePicker.value);
            });

            // 實作平滑移動「現在時間」紅線，每 10 秒更新一次
            // (v2.0 已將 updateNowLine 抽離至檔案上方獨立 setInterval)

            // 僅顯示延誤 Toggle Badge 控制邏輯
            window.toggleDelayOnlyFilter = () => {
                const checkbox = document.getElementById('delay-only-checkbox');
                const toggleBadge = document.getElementById('delay-toggle-btn');
                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) {
                    toggleBadge.classList.add('active');
                } else {
                    toggleBadge.classList.remove('active');
                }
                renderChart(document.getElementById('date-picker').value);
            };

            // 綁定 ECharts 點擊事件，顯示側邊面板
            myChart.on('click', function(params) {
                if (params.seriesName === '現在時間') return;
                
                // seriesName 格式範例："新自強 408次" 或 "新自強 408次 (已行駛)"
                const match = params.seriesName.match(/(\d+)次/);
                if (match && match[1]) {
                    const trainNo = match[1];
                    showTrainDetails(trainNo);
                    
                    // 將點擊的車次設為搜尋目標，觸發 Ghost Line 顯示
                    const searchInput = document.getElementById('train-search');
                    if (searchInput.value !== trainNo) {
                        searchInput.value = trainNo;
                        renderChart(document.getElementById('date-picker').value);
                    }
                }
            });

            // 點擊空白處隱藏側邊面板
            myChart.getZr().on('click', function(params) {
                // 如果沒有點擊在圖表元素上
                if (!params.target) {
                    closeSidePanel();
                }
            });

            // 讓圖表隨視窗縮放
            window.addEventListener('resize', () => { myChart.resize(); });
        });

        // 放大與縮小 X 軸時間範圍
        const handleZoom = (direction) => {
            const option = myChart.getOption();
            if (!option || !option.dataZoom || option.dataZoom.length === 0) return;
            
            // X 軸在 index 0 
            const dz = option.dataZoom[0];
            const currentMin = dz.startValue;
            const currentMax = dz.endValue;
            const range = currentMax - currentMin;
            
            let newMin, newMax;
            if (direction === 'in') {
                // 放大：範圍縮小 30% (往中間靠攏)
                newMin = currentMin + range * 0.15;
                newMax = currentMax - range * 0.15;
            } else {
                // 縮小：範圍放大 30% (往兩側展開)
                newMin = currentMin - range * 0.15;
                newMax = currentMax + range * 0.15;
            }
            
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomIndex: 0,
                startValue: newMin,
                endValue: newMax
            });
        };

        // 放大與縮小 Y 軸車站範圍 (拉開/壓縮車站間距)
        const handleZoomY = (direction) => {
            const option = myChart.getOption();
            if (!option || !option.dataZoom || option.dataZoom.length < 2) return;
            
            // Y 軸在 index 1
            const dz = option.dataZoom[1];
            const totalCount = option.yAxis[0].data.length;
            
            let currentMin = dz.startValue !== undefined ? dz.startValue : 0;
            let currentMax = dz.endValue !== undefined ? dz.endValue : totalCount - 1;
            
            const range = currentMax - currentMin;
            if (range <= 2 && direction === 'in') return; // 避免縮到只剩 2 站
            
            let newMin, newMax;
            if (direction === 'in') {
                // 放大：顯示更少車站 (範圍收縮 20%)
                newMin = Math.round(currentMin + range * 0.1);
                newMax = Math.round(currentMax - range * 0.1);
            } else {
                // 縮小：顯示更多車站 (範圍擴張 20%)
                newMin = Math.max(0, Math.round(currentMin - range * 0.1));
                newMax = Math.min(totalCount - 1, Math.round(currentMax + range * 0.1));
            }
            
            if (newMin >= newMax) {
                newMin = Math.max(0, newMax - 2);
            }
            
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomIndex: 1,
                startValue: newMin,
                endValue: newMax
            });
        };

        // 重設 X 軸與 Y 軸為當天預設視野
        const resetZoom = () => {
            if (!myChart) return;
            
            // 重設 X 軸 (全天 25 小時)
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomIndex: 0,
                start: 0,
                end: 100
            });

            // 重設 Y 軸 (顯示所有車站)
            const option = myChart.getOption();
            if (option && option.yAxis && option.yAxis[0]) {
                const totalCount = option.yAxis[0].data.length;
                myChart.dispatchAction({
                    type: 'dataZoom',
                    dataZoomIndex: 1,
                    startValue: 0,
                    endValue: totalCount - 1
                });
            }
        };
    </script>
    <!-- 通阻面板 Modal -->
    <div id="alerts-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,15,18,0.85); backdrop-filter: blur(8px); z-index: 20000; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        <div style="background: #1a1a20; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; width: 90%; max-width: 500px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.6); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);" id="alerts-modal-box">
            <div style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: #fff; font-size: 18px; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-exclamation-triangle" style="color: #ff4757;"></i> 營運通阻清單
                </h3>
                <button onclick="closeAlertsModal()" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 32px; height: 32px; color: #a4b0be; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;"><i class="fas fa-times"></i></button>
            </div>
            <div id="alerts-modal-body" style="padding: 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px;">
                <!-- 動態填入 -->
            </div>
        </div>
    </div>
</body>
