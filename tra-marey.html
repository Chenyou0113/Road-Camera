    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome -->

    <!-- 引入 Apache ECharts -->

    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #0f0f12; color: #f1f2f6; 
            font-family: 'Outfit', 'Noto Sans TC', 'Segoe UI', sans-serif; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header { 
            padding: 12px 24px; 
            background: rgba(26, 26, 32, 0.95); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            z-index: 10; position: relative;
        }
        .header-title-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            color: #a4b0be;
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            color: #fff;
            background: rgba(79, 172, 254, 0.2);
            border-color: #4facfe;
            transform: translateX(-2px);
        }
        h2 { 
            margin: 0; 
            font-size: 20px; 
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 控制列樣式 */
        #toolbar {
            background: rgba(20, 20, 26, 0.8); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 24px;
            display: flex; gap: 24px; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9; position: relative;
            flex-wrap: wrap;
        }
        .toolbar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-item label {
            color: #a4b0be;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="date"], input[type="text"], select {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: #4facfe;
            background: rgba(25, 25, 30, 0.95);
            box-shadow: 0 0 8px rgba(79, 172, 254, 0.4);
        }
        input[type="text"] { width: 180px; cursor: text; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        select optgroup {
            background: #1f1f26;
            color: #fff;
        }
        select option {
            background: #1f1f26;
            color: #fff;
        }

        .status { 
            font-size: 14px; 
            font-weight: 500;
            color: #ffa502; 
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 165, 2, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 165, 2, 0.2);
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .status.success {
            color: #2ed573;
            background: rgba(46, 213, 115, 0.1);
            border-color: rgba(46, 213, 115, 0.2);
        }
        .status i {
            animation: spin 2s linear infinite;
        }
        .status.success i {
            animation: none;
        }
        .legend { font-size: 13px; display: flex; gap: 20px; align-items: center; }
        .legend span { display: flex; align-items: center; gap: 6px; color: #a4b0be; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px currentColor; }
        
        #chart-container { 
            flex: 1;
            width: 100vw; 
        }

        /* 側邊面板樣式 */
        #side-panel {
            position: fixed;
            top: 61px; /* 在 header 下方 */
            right: -360px;
            width: 320px;
            height: calc(100vh - 61px);
            background: rgba(20, 20, 26, 0.95);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);

            display: flex;
            flex-direction: column;
            color: #f1f2f6;
        }
        #side-panel.active {
            right: 0;
        }
        .sp-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

        .sp-header-info {
            flex: 1;
        }
        .sp-title {

            font-weight: 700;
            margin-bottom: 4px;
        }
        .sp-route {
            font-size: 0.9rem;
            color: #a4b0be;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sp-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .sp-close:hover {
            background: rgba(255, 71, 87, 0.8);
            transform: scale(1.1) rotate(90deg);
        }
        .sp-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
        }
        .sp-body::-webkit-scrollbar { width: 6px; }
        .sp-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .sp-body::-webkit-scrollbar-track { background: transparent; }

        .timeline {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 55px; 
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .timeline-item {
            display: flex;
            position: relative;
            margin-bottom: 24px;
            min-height: 40px;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        .timeline-item.past {
            opacity: 0.35;
            filter: grayscale(100%);
        }
        .tl-time {
            width: 45px;
            text-align: right;
            padding-right: 15px;
            font-family: 'Outfit', monospace;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 1px;
        }
        .tl-time .expected {
            color: #a4b0be;
        }
        .tl-time .actual {
            color: #ff4757;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .tl-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2ed573;
            border: 3px solid #14141a;
            position: absolute;
            left: 49px;
            top: 4px;
            z-index: 2;
            box-shadow: 0 0 8px rgba(46, 213, 115, 0.4);
        }
        .timeline-item.past .tl-node {
            background: #a4b0be;
            box-shadow: none;
        }
        .timeline-item.delayed .tl-node {
            background: #ff4757;
            box-shadow: 0 0 8px rgba(255, 71, 87, 0.4);
        }
        .tl-content {
            padding-left: 25px;
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .station-name {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 1px;
        }

            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;

            background: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid rgba(46, 213, 115, 0.2);
            white-space: nowrap;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

            }

        // 根據台灣時間取得「今天」日期字串 YYYY-MM-DD
        const getTwTodayString = () => {
            return new Date(Date.now() + 8 * 3600000).toISOString().split('T')[0];
        };

        // 根據車種決定線條顏色，同步自 tra-pids 配色 (新自強改為深灰)
        const getTrainColor = (type, trainNo) => {
            const no = Number(trainNo || 0);
            
            // 特殊觀光與專用車次
            if (no === 4666 || no === 4667) return '#ffd54f'; // steam 蒸汽火車
            if ((no >= 6001 && no <= 6099) || (no >= 6701 && no <= 6799)) return '#e0821d'; // 鳴日號
            if (no === 6652 || no === 6655) return '#7edece'; // 海風號
            if (no === 6631 || no === 6632 || no === 6633) return '#d1f024'; // 山嵐號
            if (no === 1 || no === 2) return '#f774ba'; // 環島之星
            if (no >= 6801 && no <= 6899) return '#7db583'; // 入伍專車

            // 一般車種
            if (type.includes("新自強") || type.includes("EMU3000")) return '#555555'; // 新自強 (中深灰)
            if (type.includes("太魯閣")) return '#e6a822'; // 太魯閣 (橙黃)
            if (type.includes("普悠瑪")) return '#de3923'; // 普悠瑪 (紅色)
            if (type.includes("自強")) return '#eb7405'; // 自強號 (深橘)
            if (type.includes("莒光")) return '#9c612a'; // 莒光號 (棕褐)
            if (type.includes("區間快")) return '#6ac242'; // 區間快 (嫩綠)
            if (type.includes("區間") || type.includes("復興")) return '#48c5db'; // 區間車 (天藍)
            if (type.includes("藍皮普快") || type.includes("普快")) return '#5047d1'; // 藍皮普快 (深藍)
            if (type.includes("專車") || type.includes("郵輪") || type.includes("包車")) return '#a3175d'; // 專車 (暗紫)
            
            return '#a4b0be'; // 預設灰色
        };

        // 全域狀態變數
        let globalTimetable = [];
        let globalLiveMap = {};
        let autoRefreshTimer = null; // 自動刷新定時器
        const myChart = echarts.init(document.getElementById('chart-container'), 'dark');

        // 將 HH:mm 轉換為 JS Timestamp，並處理跨夜列車問題
        const parseTimeToTimestamp = (timeStr, baseDateStr, firstStopTimeMins) => {
            if (!timeStr) return null;
            const [h, m] = timeStr.split(':').map(Number);
            const currentMins = h * 60 + m;
            
            let offsetDay = 0;
            // 如果當前站的時間比發車站小超過 12 小時，判定為跨夜列車 (日期+1)
            if (firstStopTimeMins !== null && currentMins < firstStopTimeMins - 720) {
                offsetDay = 1;
            }

            const date = new Date(`${baseDateStr}T00:00:00+08:00`);
            date.setDate(date.getDate() + offsetDay);
            date.setHours(h, m, 0, 0);
            return date.getTime();
        };

        // 核心渲染函數 (會根據搜尋框的內容動態改變透明度與粗細，並過濾當前線路車站)
        const renderChart = (dateStr) => {
            const lineKey = document.getElementById('line-select').value;
            const activeStations = LINE_CONFIG[lineKey].stations;
            const searchVal = document.getElementById('train-search').value.trim();
            const seriesData = [];
            const todayStr = dateStr;
            const isToday = (dateStr === getTwTodayString());

            globalTimetable.forEach(train => {
                let pathData = [];
                let firstStopTimeMins = null;

                // 篩選出這班車在我們當前選取線路內的停靠站
                const filteredStops = train.Stops.filter(stop => activeStations.includes(stop.Name));

                if (filteredStops.length > 1) {
                    filteredStops.forEach((stop, index) => {
                        const timeStr = stop.Dep || stop.Arr; 
                        if (timeStr) {
                            const [h, m] = timeStr.split(':').map(Number);
                            if (index === 0) firstStopTimeMins = h * 60 + m; 

                            const timeVal = parseTimeToTimestamp(timeStr, todayStr, firstStopTimeMins);
                            pathData.push([timeVal, stop.Name]);
                        }
                    });

                    const isDelayed = globalLiveMap[train.No] && globalLiveMap[train.No].DelayTime > 0;
                    const delayMins = isDelayed ? globalLiveMap[train.No].DelayTime : 0;
                    const baseColor = getTrainColor(train.Type, train.No);

                    // 🎯 搜尋高亮與淡化背景邏輯
                    let opacity = 0.85;
                    let lineWidth = isDelayed ? 2.5 : 1.5;
                    let zIndex = 1;

                    if (searchVal !== "") {
                        if (String(train.No) === searchVal) {
                            opacity = 1;
                            lineWidth = 5;
                            zIndex = 10;
                        } else {
                            opacity = 0.12;
                            lineWidth = 1;
                            zIndex = 0;
                        }
                    }

                    // 判斷是否需要拆分實虛線 (必須是今天且有延誤)
                    if (isToday && isDelayed) {
                        const nowTime = Date.now();
                        const pastStops = [];
                        const futureStops = [];

                        pathData.forEach(pt => {
                            const stopTime = pt[0];
                            if (stopTime <= nowTime) {
                                pastStops.push(pt);
                            } else {
                                futureStops.push(pt);
                            }
                        });

                        // 為了保證線路不中斷，如果兩邊都有點，將過去路段的最後一站複製到未來路段的起點
                        if (pastStops.length > 0 && futureStops.length > 0) {
                            futureStops.unshift(pastStops[pastStops.length - 1]);
                        }

                        // 渲染過去路段 (已駛過 - 實線)
                        if (pastStops.length > 1) {
                            seriesData.push({
                                name: `${train.Type} ${train.No}次 (已行駛)`,
                                type: 'line',
                                data: pastStops,
                                symbol: 'circle',
                                symbolSize: searchVal === String(train.No) ? 8 : 5, 
                                showSymbol: searchVal === String(train.No), 
                                z: zIndex,
                                lineStyle: {
                                    color: baseColor,
                                    width: lineWidth,
                                    type: 'solid', 
                                    opacity: opacity
                                },
                                itemStyle: { color: baseColor, opacity: opacity },
                                tooltip: {
                                    formatter: function (params) {
                                        const baseTimeMs = params.value[0];
                                        const time = new Date(baseTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                                        const actualTimeMs = baseTimeMs + delayMins * 60000;
                                        const actualTime = new Date(actualTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                                        let delayStatusText = delayMins > 0 ? `<span style="color:#ff4757; font-weight:bold;">⚠️ 晚 ${delayMins} 分</span>` : '<span style="color:#2ed573; font-weight:bold;">✅ 準點</span>';
                                        return `<div style="padding:5px;">
                                                    <strong style="color:${baseColor}">${train.Type} ${train.No}次</strong><br>
                                                    📍 <b>${params.value[1]}</b> 站<br>
                                                    ⏱️ 預計時間：${time}<br>
                                                    🕒 實際時間：${actualTime}<br>
                                                    📊 運行狀況：${delayStatusText}
                                                </div>`;
                                    }
                                }
                            });
                        }

                        // 渲染未來路段 (預計延遲 - 虛線)
                        if (futureStops.length > 1) {
                            seriesData.push({
                                name: `${train.Type} ${train.No}次 (預估延遲)`,
                                type: 'line',
                                data: futureStops,
                                symbol: 'circle',
                                symbolSize: searchVal === String(train.No) ? 8 : 5, 
                                showSymbol: searchVal === String(train.No), 
                                z: zIndex + 1, 
                                lineStyle: {
                                    color: baseColor,
                                    width: lineWidth,
                                    type: 'dashed', 
                                    opacity: opacity
                                },
                                itemStyle: { color: baseColor, opacity: opacity },
                                tooltip: {
                                    formatter: function (params) {
                                        const baseTimeMs = params.value[0];
                                        const time = new Date(baseTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                                        const estTimeMs = baseTimeMs + delayMins * 60000;
                                        const estTime = new Date(estTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                                        let delayStatusText = delayMins > 0 ? `<span style="color:#ff4757; font-weight:bold;">⚠️ 預計晚 ${delayMins} 分</span>` : '<span style="color:#2ed573; font-weight:bold;">✅ 預計準點</span>';
                                        return `<div style="padding:5px;">
                                                    <strong style="color:${baseColor}">${train.Type} ${train.No}次 (未來路段)</strong><br>
                                                    📍 <b>${params.value[1]}</b> 站<br>
                                                    ⏱️ 預計時間：${time}<br>
                                                    🕒 實際時間：${estTime}<br>
                                                    📊 運行狀況：${delayStatusText}
                                                </div>`;
                                    }
                                }
                            });
                        }
                    } else {
                        // 無延遲，或非今天：整條實線
                        seriesData.push({
                            name: `${train.Type} ${train.No}次`,
                            type: 'line',
                            data: pathData,
                            symbol: 'circle',
                            symbolSize: searchVal === String(train.No) ? 8 : 5, 
                            showSymbol: searchVal === String(train.No), 
                            z: zIndex,
                            lineStyle: {
                                color: baseColor,
                                width: lineWidth,
                                type: 'solid', 
                                opacity: opacity
                            },
                            itemStyle: { color: baseColor, opacity: opacity },
                            tooltip: {
                                formatter: function (params) {
                                    const baseTimeMs = params.value[0];
                                    const time = new Date(baseTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                                    const estTimeMs = baseTimeMs + delayMins * 60000;
                                    const estTime = new Date(estTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                                    let delayStatusText = delayMins > 0 ? `<span style="color:#ff4757; font-weight:bold;">⚠️ 晚 ${delayMins} 分</span>` : '<span style="color:#2ed573; font-weight:bold;">✅ 準點</span>';
                                    return `<div style="padding:5px;">
                                                <strong style="color:${baseColor}">${params.seriesName}</strong><br>
                                                📍 <b>${params.value[1]}</b> 站<br>
                                                ⏱️ 預計時間：${time}<br>
                                                🕒 實際時間：${estTime}<br>
                                                📊 運行狀況：${delayStatusText}
                                            </div>`;
                                }
                            }
                        });
                    }
                }
            });

            // 反轉 Y 軸分類，確保起點車站在上方
            const yAxisData = [...activeStations].reverse();

            // 決定 X 軸預設視野
            let viewMin, viewMax;
            if (isToday) {
                const now = Date.now();
                viewMin = now - (1 * 3600 * 1000);
                viewMax = now + (3 * 3600 * 1000);
            } else {
                const baseTime = new Date(`${dateStr}T00:00:00+08:00`).getTime();
                viewMin = baseTime + (6 * 3600 * 1000);
                viewMax = baseTime + (12 * 3600 * 1000);
            }

            // 🎯 新增一條垂直的「現在時間基準線」，比對任何列車與此垂直紅線的交點，即為該列車在現在那一刻所在的車站位置
            if (isToday) {
                seriesData.push({
                    name: '現在時間',
                    type: 'line',
                    data: [],
                    markLine: {
                        symbol: ['none', 'none'],
                        label: {
                            show: true,
                            formatter: '現在時間',
                            position: 'end',
                            color: '#ff4757',
                            fontSize: 12,
                            fontWeight: 'bold',
                            backgroundColor: 'rgba(20, 20, 26, 0.95)',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            padding: [6, 10],
                            borderRadius: 6
                        },
                        lineStyle: {
                            color: '#ff4757',
                            type: 'solid',
                            width: 2,
                            shadowColor: 'rgba(255, 71, 87, 0.5)',
                            shadowBlur: 10
                        },
                        data: [{ xAxis: Date.now() }]
                    }
                });
            }

            const option = {
                backgroundColor: '#0f0f12',
                animation: false, 
                tooltip: { 
                    trigger: 'item',
                    backgroundColor: 'rgba(26, 26, 32, 0.95)',
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    textStyle: { color: '#f1f2f6', fontFamily: 'inherit' }
                },
                dataZoom: [
                    { type: 'inside', xAxisIndex: 0, filterMode: 'none' }, 
                    { type: 'inside', yAxisIndex: 0, filterMode: 'none' }, 
                    { type: 'slider', xAxisIndex: 0, bottom: 10, height: 20, borderColor: '#26262b', textStyle: { color: '#fff' } }
                ],
                grid: { top: 30, right: 40, bottom: 50, left: 80 },
                xAxis: {
                    type: 'time',
                    splitLine: { show: true, lineStyle: { color: '#1e1e24' } }, 
                    axisLabel: { formatter: '{HH}:{mm}', color: '#a4b0be' },
                    min: viewMin,
                    max: viewMax
                },
                yAxis: {
                    type: 'category',
                    data: yAxisData,
                    splitLine: { show: true, lineStyle: { color: '#1e1e24' } },
                    axisLabel: { color: '#f1f2f6', fontSize: 13, fontWeight: 'bold' }
                },
                series: seriesData
            };

            myChart.setOption(option);
        };

        // 關閉側邊面板
        const closeSidePanel = () => {
            const panel = document.getElementById('side-panel');
            panel.classList.remove('active');
        };

        // 顯示列車詳細資訊面板
        const showTrainDetails = (trainNo) => {
            const train = globalTimetable.find(t => String(t.No) === String(trainNo));
            if (!train) return;

            const panel = document.getElementById('side-panel');
            const titleEl = document.getElementById('sp-title');
            const routeEl = document.getElementById('sp-route');
            const timelineEl = document.getElementById('sp-timeline');

            const trainColor = getTrainColor(train.Type, train.No);
            titleEl.innerHTML = `<span style="color:${trainColor}">${train.Type} <span style="font-family:'Outfit'">${train.No}</span>次</span>`;
            routeEl.innerHTML = `<i class="fas fa-map-marker-alt" style="color:#a4b0be;"></i> ${train.StartStation} <i class="fas fa-arrow-right" style="margin: 0 4px; font-size: 0.8em; color: rgba(255,255,255,0.2)"></i> ${train.EndStation}`;
            
            const isDelayed = globalLiveMap[train.No] && globalLiveMap[train.No].DelayTime > 0;
            const delayMins = isDelayed ? globalLiveMap[train.No].DelayTime : 0;
            const nowTime = Date.now();
            const datePickerVal = document.getElementById('date-picker').value;
            const isToday = (datePickerVal === getTwTodayString());

            let html = '';
            let firstStopTimeMins = null;

            train.Stops.forEach((stop, index) => {
                const timeStr = stop.Dep || stop.Arr;
                if (!timeStr) return;
                
                const [h, m] = timeStr.split(':').map(Number);
                if (index === 0) firstStopTimeMins = h * 60 + m; 
                const timeVal = parseTimeToTimestamp(timeStr, datePickerVal, firstStopTimeMins);
                
                let isPast = false;
                let actualTimeStr = timeStr;
                let delayStatusHtml = '';
                let delayedClass = '';

                if (isToday) {
                    if (timeVal <= nowTime) isPast = true;
                    if (delayMins > 0) {
                        const actualTimeMs = timeVal + delayMins * 60000;
                        const actualDate = new Date(actualTimeMs);
                        actualTimeStr = `${String(actualDate.getHours()).padStart(2, '0')}:${String(actualDate.getMinutes()).padStart(2, '0')}`;
                        delayStatusHtml = `<div class="delay-tag ${isPast ? 'past' : ''}">晚 ${delayMins} 分</div>`;
                        delayedClass = 'delayed';
                    } else {
                        delayStatusHtml = `<div class="ontime-tag">準點</div>`;
                    }
                }

                html += `
                    <div class="timeline-item ${isPast ? 'past' : ''} ${delayedClass}">
                        <div class="tl-time">
                            <div class="expected">${timeStr}</div>
                            ${(isToday && delayMins > 0) ? `<div class="actual">${actualTimeStr}</div>` : ''}
                        </div>
                        <div class="tl-node"></div>
                        <div class="tl-content">
                            <div class="station-name">${stop.Name}</div>
                            ${delayStatusHtml}
                        </div>
                    </div>
                `;
            });

            timelineEl.innerHTML = html;
            panel.classList.add('active');
        };

        // 設定每 60 秒的背景刷新定時器
        const startAutoRefresh = () => {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);

            autoRefreshTimer = setInterval(async () => {
                const datePicker = document.getElementById('date-picker');
                // 只有日期選定為「今天」時，才有即時位置與誤點更新的必要
                if (datePicker.value === getTwTodayString()) {
                    const statusEl = document.getElementById('loading-status');
                    try {
                        statusEl.classList.remove('success');
                        statusEl.style.opacity = '1';
                        statusEl.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                        statusEl.style.background = 'rgba(255, 165, 2, 0.1)';
                        statusEl.style.color = '#ffa502';
                        statusEl.innerHTML = `<i class="fas fa-sync fa-spin"></i> <span id="status-text">更新即時位置中...</span>`;
                        
                        const liveRes = await fetch(`${API_BASE}/api/live`);
                        const liveData = await liveRes.json();
                        globalLiveMap = {};
                        liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                        
                        renderChart(datePicker.value);
                        
                        statusEl.classList.add('success');
                        statusEl.innerHTML = `<i class="fas fa-check"></i> 即時位置已更新`;
                        setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
                    } catch (e) {
                        console.error("每分鐘更新即時位置失敗:", e);
                        statusEl.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                        statusEl.style.background = 'rgba(255, 71, 87, 0.1)';
                        statusEl.style.color = '#ff4757';
                        statusEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> 位置更新失敗`;
                        setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
                    }
                }
            }, 60000); // 60 秒
        };

        // 從 API 下載資料並更新全域變數
        const loadData = async (dateStr) => {
            const statusEl = document.getElementById('loading-status');
            
            // 清除之前的自動更新定時器
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }

            try {
                myChart.clear(); 
                statusEl.classList.remove('success');
                statusEl.style.opacity = '1';
                statusEl.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                statusEl.style.background = 'rgba(255, 165, 2, 0.1)';
                statusEl.style.color = '#ffa502';
                statusEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span id="status-text">下載時刻表中...</span>`;
                
                const textEl = document.getElementById('status-text');

                // 1. 抓取該日時刻表
                const res = await fetch(`${API_BASE}/api/timetable/daily?date=${dateStr}`);
                if (!res.ok) throw new Error("無該日時刻表資料");
                globalTimetable = await res.json();
                
                // 2. 只有選擇「今天」才抓取即時誤點資料
                if (dateStr === getTwTodayString()) {
                    textEl.innerText = "抓取即時動態中...";
                    const liveRes = await fetch(`${API_BASE}/api/live`);
                    const liveData = await liveRes.json();
                    globalLiveMap = {};
                    liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                } else {
                    globalLiveMap = {}; 
                }

                textEl.innerText = "渲染圖表中...";
                renderChart(dateStr);
                
                statusEl.classList.add('success');
                statusEl.innerHTML = `<i class="fas fa-check"></i> 載入完成 (共 ${globalTimetable.length} 班次)`;
                
                // 載入成功後，如果是今天，則重新啟動自動更新定時器
                if (dateStr === getTwTodayString()) {
                    startAutoRefresh();
                }

                setTimeout(() => { 
                    statusEl.style.opacity = '0'; 
                    statusEl.style.transition = 'opacity 1s'; 
                }, 3000);

            } catch (err) {
                console.error(err);
                globalTimetable = [];
                statusEl.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                statusEl.style.background = 'rgba(255, 71, 87, 0.1)';
                statusEl.style.color = '#ff4757';
                statusEl.innerHTML = `<i class="fas fa-times"></i> 載入失敗: ${err.message}`;
            }
        };

        // 綁定事件監聽器
        document.addEventListener('DOMContentLoaded', () => {
            const lineSelect = document.getElementById('line-select');
            const datePicker = document.getElementById('date-picker');
            const searchInput = document.getElementById('train-search');

            // 預設設定為今天
            const todayStr = getTwTodayString();
            datePicker.value = todayStr;
            
            // 限制日期選擇範圍為：今天至未來 60 天
            datePicker.min = todayStr;
            
            const todayDate = new Date(Date.now() + 8 * 3600000);
            const maxDate = new Date(todayDate);
            maxDate.setDate(todayDate.getDate() + 60);
            datePicker.max = maxDate.toISOString().split('T')[0];
            
            // 首次載入資料
            loadData(datePicker.value);

            // 當日期改變時，重新下載資料
            datePicker.addEventListener('change', (e) => {
                loadData(e.target.value);
            });

            // 當線路切換時，進行前端 0 延遲過濾與重繪
            lineSelect.addEventListener('change', () => {
                renderChart(datePicker.value);
            });

            // 當搜尋框內容改變時，重新繪製
            searchInput.addEventListener('input', () => {
                renderChart(datePicker.value);
            });

            // 綁定 ECharts 點擊事件，顯示側邊面板
            myChart.on('click', function(params) {
                if (params.seriesName === '現在時間') return;
                
                // seriesName 格式範例："新自強 408次" 或 "新自強 408次 (已行駛)"
                const match = params.seriesName.match(/(\d+)次/);
                if (match && match[1]) {
                    showTrainDetails(match[1]);
                }
            });

            // 點擊空白處隱藏側邊面板
            myChart.getZr().on('click', function(params) {
                // 如果沒有點擊在圖表元素上
                if (!params.target) {
                    closeSidePanel();
                }
            });

            // 讓圖表隨視窗縮放
            window.addEventListener('resize', () => { myChart.resize(); });
        });
    </script>
</body>
</html>
