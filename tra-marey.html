            },
            "neiwan": {
                name: "支線-內灣線 (新竹 － 內灣)",
                stations: ["新竹", "北新竹", "千甲", "新莊", "竹中", "上員", "榮華", "竹東", "橫山", "九讚頭", "合興", "富貴", "內灣"]
            },
            "liujia": {
                name: "支線-六家線 (新竹 － 六家)",
                stations: ["新竹", "北新竹", "千甲", "新莊", "竹中", "六家"]
            },
            "jiji": {
                name: "支線-集集線 (二水 － 車埕)",
                stations: ["二水", "源泉", "濁水", "龍泉", "集集", "水里", "車埕"]
            },
            "shalun": {
                name: "支線-沙崙線 (中洲 － 沙崙)",
                stations: ["中洲", "長榮大學", "沙崙"]
            }
        };

        // 預建 站名→所屬線路 查找表 (效能優化：避免每次呼叫 getStationLines 都遍歷 LINE_CONFIG)
        const STATION_LINE_MAP = new Map();
        (function buildStationLineMap() {
            for (const [key, cfg] of Object.entries(LINE_CONFIG)) {
                cfg.stations.forEach(st => {
                    if (!STATION_LINE_MAP.has(st)) STATION_LINE_MAP.set(st, []);
                    STATION_LINE_MAP.get(st).push(key);
                });
            }
        })();

        // 根據台灣時間取得「今天」日期字串 YYYY-MM-DD
        const getTwTodayString = () => {
            return new Date(Date.now() + 8 * 3600000).toISOString().split('T')[0];
        };

        // 根據車種決定線條顏色，同步自 tra-pids 配色 (新自強改為深灰)
        const getTrainColor = (type, trainNo) => {
            const no = Number(trainNo || 0);
            
            // 特殊觀光與專用車次
            if (no === 4666 || no === 4667) return '#bdc3c7'; // 蒸汽火車
            if ((no >= 6001 && no <= 6099) || (no >= 6701 && no <= 6799)) return '#e0821d'; // 鳴日號
            if (no === 6652 || no === 6655) return '#7edece'; // 海風號
            if (no === 6631 || no === 6632 || no === 6633) return '#d1f024'; // 山嵐號
            if (no === 1 || no === 2) return '#f774ba'; // 環島之星
            if (no >= 6801 && no <= 6899) return '#7db583'; // 入伍專車

            // 一般車種
            if (type.includes("新自強") || type.includes("EMU3000")) return '#888888'; // 新自強 (中灰，更易看清)
            if (type.includes("太魯閣")) return '#e6a822'; // 太魯閣 (橙黃)
            if (type.includes("普悠瑪")) return '#de3923'; // 普悠瑪 (紅色)
            if (type.includes("自強")) return '#eb7405'; // 自強號 (深橘)
            if (type.includes("莒光")) return '#9c612a'; // 莒光號 (棕褐)
            if (type.includes("區間快")) return '#6ac242'; // 區間快 (嫩綠)
            if (type.includes("區間") || type.includes("復興")) return '#48c5db'; // 區間車 (天藍)
            if (type.includes("藍皮普快") || type.includes("普快")) return '#5047d1'; // 藍皮普快 (深藍)
            if (type.includes("專車") || type.includes("郵輪") || type.includes("包車")) return '#a3175d'; // 專車 (暗紫)
            
            return '#a4b0be'; // 預設灰色
        };

        // 簡化台鐵又臭又長的車種名稱 (例如：將「自強(3000)(EMU3000 型電車)」轉為「新自強」)
        const getShortTrainType = (type, trainNo) => {
            const no = Number(trainNo || 0);
            const t = String(type || '');
            
            if (no === 4666 || no === 4667) return "蒸汽火車";
            if ((no >= 6001 && no <= 6099) || (no >= 6701 && no <= 6799)) return "鳴日號";
            if (no === 6652 || no === 6655) return "海風號";
            if (no === 6631 || no === 6632 || no === 6633) return "山嵐號";
            if (no === 1 || no === 2) return "環島之星";
            if (no >= 6801 && no <= 6899) return "入伍專車";
            
            if (t.includes('新自強') || t.includes('EMU3000') || t.includes('3000')) return '新自強';
            if (t.includes('太魯閣')) return '太魯閣';
            if (t.includes('普悠瑪')) return '普悠瑪';
            if (t.includes('自強')) return '自強';
            if (t.includes('莒光')) return '莒光';
            if (t.includes('區間快')) return '區間快';
            if (t.includes('區間') || t.includes('復興')) return '區間';
            if (t.includes('藍皮普快') || t.includes('普快')) return '普快';
            if (t.includes('專車') || t.includes('郵輪') || t.includes('包車')) return '專車';
            return t.split('(')[0] || t;
        };

        // 全域狀態變數
        let globalTimetable = [];
        let globalLiveMap = {};
        let globalAlerts = [];
        let globalSearchedTimes = []; // 全域儲存搜尋車次的時刻，方便重設 zoom 視野
        let autoRefreshTimer = null; // 自動刷新定時器
        const myChart = echarts.init(document.getElementById('chart-container'), 'dark');

        // 將 HH:mm 轉換為 JS Timestamp，並處理跨夜列車問題
        const parseTimeToTimestamp = (timeStr, baseDateStr, firstStopTimeMins) => {
            if (!timeStr) return null;
            const [h, m] = timeStr.split(':').map(Number);
            const currentMins = h * 60 + m;
            
            let offsetDay = 0;
            // 如果當前站的時間比發車站小超過 12 小時，判定為跨夜列車 (日期+1)
            if (firstStopTimeMins !== null && currentMins < firstStopTimeMins - 720) {
                offsetDay = 1;
            }

            const date = new Date(`${baseDateStr}T00:00:00+08:00`);
            date.setDate(date.getDate() + offsetDay);
            date.setHours(h, m, 0, 0);
            return date.getTime();
        };

        // 八大核心跨線路接點定義
        const JUNCTIONS = [
            { name: "八堵", lines: ["west-north", "yilan"] },
            { name: "竹南", lines: ["west-north", "west-mountain", "west-sea"] },
            { name: "彰化", lines: ["west-mountain", "west-sea", "west-south"] },
            { name: "高雄", lines: ["west-south", "pingtung"] },
            { name: "枋寮", lines: ["pingtung", "south-link"] },
            { name: "臺東", lines: ["south-link", "taitung"] },
            { name: "花蓮", lines: ["taitung", "north-link"] },
            { name: "蘇澳新", lines: ["north-link", "yilan"] }
        ];

        // 取得車站所屬線路 (查表，O(1))
        const getStationLines = (stationName) => {
            return STATION_LINE_MAP.get(stationName) || [];
        };

        // 尋找兩站之間跨線路的接點 (BFS 路徑搜尋) — 含 Map 快取
        const _junctionCache = new Map();
        const findJunctionsBetween = (statA, statB) => {
            const cacheKey = `${statA}|${statB}`;
            if (_junctionCache.has(cacheKey)) return _junctionCache.get(cacheKey);
            const linesA = getStationLines(statA);
            const linesB = getStationLines(statB);
            
            if (linesA.some(l => linesB.includes(l))) {
                return []; // 在同一條線路內，不需插接點
            }
            
            const queue = [];
            const visited = new Set();
            const parent = {};
            
            linesA.forEach(l => {
                queue.push(l);
                visited.add(l);
            });
            
            let foundLine = null;
            while (queue.length > 0) {
                const currLine = queue.shift();
                if (linesB.includes(currLine)) {
                    foundLine = currLine;
                    break;
                }
                
                for (const junc of JUNCTIONS) {
                    if (junc.lines.includes(currLine)) {
                        for (const nextLine of junc.lines) {
                            if (!visited.has(nextLine)) {
                                visited.add(nextLine);
                                parent[nextLine] = { prevLine: currLine, junction: junc.name };
                                queue.push(nextLine);
                            }
                        }
                    }
                }
            }
            
            if (!foundLine) { _junctionCache.set(cacheKey, []); return []; }
            
            const path = [];
            let curr = foundLine;
            while (parent[curr]) {
                path.unshift(parent[curr].junction);
                curr = parent[curr].prevLine;
            }
            _junctionCache.set(cacheKey, path);
            return path;
        };

        // 插值計算接點的預估抵達/開車時間
        const interpolateJunctionStops = (stopA, stopB, junctions) => {
            const path = [stopA.Name, ...junctions, stopB.Name];
            
            const parseToMins = (tStr) => {
                if (!tStr) return null;
                const [h, m] = tStr.split(':').map(Number);
                return h * 60 + m;
            };
            
            const timesA = parseToMins(stopA.Dep || stopA.Arr);
            let timesB = parseToMins(stopB.Arr || stopB.Dep);
            
            if (timesA === null || timesB === null) return [];
            if (timesB < timesA) timesB += 1440; // 跨夜處理
            
            const distances = [];
            for (let i = 0; i < path.length - 1; i++) {
                const s1 = path[i];
                const s2 = path[i+1];
                const lines1 = getStationLines(s1);
                const lines2 = getStationLines(s2);
                const sharedLine = lines1.find(l => lines2.includes(l));
                if (sharedLine) {
                    const idx1 = LINE_CONFIG[sharedLine].stations.indexOf(s1);
                    const idx2 = LINE_CONFIG[sharedLine].stations.indexOf(s2);
                    distances.push(Math.abs(idx1 - idx2));
                } else {
                    distances.push(5); // 預設降級權重
                }
            }
            
            const totalDist = distances.reduce((a, b) => a + b, 0);
            if (totalDist === 0) return [];
            
            const timeRange = timesB - timesA;
            const virtualStops = [];
            
            let currentDist = 0;
            for (let i = 0; i < junctions.length; i++) {
                currentDist += distances[i];
                const ratio = currentDist / totalDist;
                const juncMins = timesA + timeRange * ratio;
                
                // 轉回 HH:mm:ss 字串
                let normMins = Math.round(juncMins) % 1440;
                if (normMins < 0) normMins += 1440;
                const h = Math.floor(normMins / 60);
                const m = normMins % 60;
                const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;
                
                virtualStops.push({
                    Seq: 999,
                    SID: "",
                    Name: junctions[i],
                    Arr: timeStr,
                    Dep: timeStr,
                    Susp: stopA.Susp || stopB.Susp || 0
                });
            }
            
            return virtualStops;
        };

        // HTML 跳脫函式 (防止 XSS)
        const escapeHtml = (str) => {
            if (str == null) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        };

        // 共用 Tooltip formatter 工廠 (減少三處幾乎相同的 tooltip 程式碼)
        const createTooltipFormatter = (train, delayMins, isSuspendedSegment, finalColor, titleSuffix, statusPrefix) => {
            const shortType = getShortTrainType(train.Type, train.No);
            return function(params) {
                const actualTimeMs = params.value[0];
                const schedTimeMs = actualTimeMs - delayMins * 60000;
                const actualTime = new Date(actualTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                const schedTime = new Date(schedTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                let delayStatusText = isSuspendedSegment 
                    ? `<span style="color:#ff4757; font-weight:bold;">❌ 停駛</span>` 
                    : (delayMins > 0 
                        ? `<span style="color:#ff4757; font-weight:bold;">⚠️ ${statusPrefix || ''}晚 ${delayMins} 分</span>` 
                        : `<span style="color:#2ed573; font-weight:bold;">✅ ${statusPrefix || ''}準點</span>`);
                const displayTitle = titleSuffix 
                    ? `${shortType} ${train.No}次 ${titleSuffix}` 
                    : `${shortType} ${train.No}次`;
                return `<div style="padding:5px;">
                            <strong style="color:${finalColor}">${displayTitle}</strong><br>
                            📍 <b>${params.value[1]}</b> 站<br>
                            ⏱️ 表訂時間：${schedTime}<br>
                            🕒 實際時間：${actualTime}<br>
                            📊 運行狀況：${delayStatusText}
                        </div>`;
            };
        };

        // 核心渲染函數 (會根據搜尋框的內容動態改變透明度與粗細，並過濾當前線路車站)
        const renderChart = (dateStr) => {
            const lineKey = document.getElementById('line-select').value;
            const activeStations = LINE_CONFIG[lineKey].stations;
            const searchVal = document.getElementById('train-search').value.trim();
            const delayOnly = document.getElementById('delay-only-checkbox').checked;
            const seriesData = [];
            const todayStr = dateStr;
            const isToday = (dateStr === getTwTodayString());
            globalSearchedTimes = [];
            
            // 複製並擴充時刻表：自動偵測跨線路接點並進行時間插值
            const processedTimetable = globalTimetable.map(train => {
                const expandedStops = [];
                for (let i = 0; i < train.Stops.length; i++) {
                    expandedStops.push(train.Stops[i]);
                    if (i < train.Stops.length - 1) {
                        const stopA = train.Stops[i];
                        const stopB = train.Stops[i+1];
                        const nameA = stopA.Name.replace("-環島", "");
                        const nameB = stopB.Name.replace("-環島", "");
                        
                        const junctions = findJunctionsBetween(nameA, nameB);
                        if (junctions.length > 0) {
                            const virtualStops = interpolateJunctionStops(stopA, stopB, junctions);
                            expandedStops.push(...virtualStops);
                        }
                    }
                }
                return { ...train, Stops: expandedStops };
            });

            processedTimetable.forEach(train => {
                let pathSegments = [];
                let currentSegment = [];
                let currentSuspState = null;

                // 計算整台車真正的第一站發車時間 (用來準確判斷跨夜)
                let trueFirstStopTimeMins = null;
                const firstTimeStr = train.Stops[0].Dep || train.Stops[0].Arr;
                if (firstTimeStr) {
                    const [h, m] = firstTimeStr.split(':').map(Number);
                    trueFirstStopTimeMins = h * 60 + m;
                }

                train.Stops.forEach(stop => {
                    // 處理環島列車特殊站名 "臺北-環島" -> "臺北"
                    const stopName = stop.Name.replace("-環島", "");
                    
                    if (activeStations.includes(stopName)) {
                        const stopSusp = train.Susp === 1 ? 1 : (stop.Susp || 0); // 若全車停駛，則各站皆為停駛
                        if (currentSegment.length > 0 && currentSuspState !== stopSusp) {
                            pathSegments.push({ stops: currentSegment, susp: currentSuspState });
                            // 狀態切換時，保留一個共同點讓線段相連
                            currentSegment = [{ ...stop, Name: stopName }];
                        } else {
                            currentSegment.push({ ...stop, Name: stopName });
                        }
                        currentSuspState = stopSusp;
                    } else {
                        if (currentSegment.length > 1) {
                            pathSegments.push({ stops: currentSegment, susp: currentSuspState });
                        }
                        currentSegment = [];
                        currentSuspState = null;
                    }
                });
                if (currentSegment.length > 1) {
                    pathSegments.push({ stops: currentSegment, susp: currentSuspState });
                }

                const isDelayed = globalLiveMap[train.No] && globalLiveMap[train.No].DelayTime > 0;
                const delayMins = isDelayed ? globalLiveMap[train.No].DelayTime : 0;
                const baseColor = getTrainColor(train.Type, train.No);

                // 僅顯示誤點開關邏輯
                if (delayOnly && delayMins === 0) {
                    return; // 準點車次直接略過不渲染
                }

                // 🎯 搜尋高亮與淡化背景邏輯
                let opacity = 0.85;
                let lineWidth = isDelayed ? 2.5 : 1.5;
                let zIndex = 1;
                let shadowBlur = 0;
                let shadowColor = 'transparent';

                if (delayMins >= 15) {
                    lineWidth = 3.5;
                    zIndex = 5;
                    shadowBlur = 12;
                    shadowColor = '#ff4757';
                }

                if (searchVal !== "") {
                    if (String(train.No) === searchVal) {
                        opacity = 1;
                        lineWidth = 5;
                        zIndex = 10;
                        if (delayMins >= 15) {
                            shadowBlur = 15;
                            shadowColor = '#ff4757';
                        }
                    } else {
                        opacity = 0.12;
                        lineWidth = 1;
                        zIndex = 0;
                        shadowBlur = 0;
                    }
                }

                pathSegments.forEach((segment, segmentIndex) => {
                    const segmentStops = segment.stops;
                    const isSuspendedSegment = segment.susp === 1;
                    
                    let pathDataScheduled = [];
                    let pathDataActual = [];

                    segmentStops.forEach(stop => {
                        if (stop.Arr) {
                            const arrVal = parseTimeToTimestamp(stop.Arr, todayStr, trueFirstStopTimeMins);
                            pathDataScheduled.push([arrVal, stop.Name]);
                            pathDataActual.push([arrVal + delayMins * 60000, stop.Name]);
                        }
                        if (stop.Dep && stop.Dep !== stop.Arr) {
                            const depVal = parseTimeToTimestamp(stop.Dep, todayStr, trueFirstStopTimeMins);
                            pathDataScheduled.push([depVal, stop.Name]);
                            pathDataActual.push([depVal + delayMins * 60000, stop.Name]);
                        }
                    });

                    // 使用實際時間來判斷畫面縮放的邊界
                    if (String(train.No) === searchVal) {
                        globalSearchedTimes.push(...pathDataActual.map(p => p[0]));
                    }

                    const activePathData = (isToday && isDelayed) ? pathDataActual : pathDataScheduled;

                    // 判斷是否需要拆分實虛線 (必須是今天且有延誤)
                    if (isToday && isDelayed) {
                        const nowTime = Date.now();
                        const pastStops = [];
                        const futureStops = [];

                        activePathData.forEach(pt => {
                            const stopTime = pt[0];
                            if (stopTime <= nowTime) {
                                pastStops.push(pt);
                            } else {
                                futureStops.push(pt);
                            }
                        });

                        // 為了保證線路不中斷，如果兩邊都有點，將過去路段的最後一站複製到未來路段的起點
                        if (pastStops.length > 0 && futureStops.length > 0) {
                            futureStops.unshift(pastStops[pastStops.length - 1]);
                        }

                        // ✨ 幽靈線 (Ghost Line) - 只在被搜尋/點擊時才顯示，避免畫面過於混亂
                        if (String(train.No) === searchVal) {
                            const shortType = getShortTrainType(train.Type, train.No);
                            seriesData.push({
                                name: `${shortType} ${train.No}次 (表訂)`,
                                type: 'line',
                                triggerLineEvent: false, // 幽靈線不觸發事件
                                data: pathDataScheduled,
                                symbol: 'none',
                                z: zIndex - 1, // 放在實際線條的下方
                                lineStyle: { color: '#a4b0be', width: 1.5, type: 'solid', opacity: 0.4 },
                                itemStyle: { color: '#a4b0be' },
                                tooltip: { show: false }
                            });
                        }

                        // 渲染過去路段 (已駛過 - 實線)
                        if (pastStops.length > 1) {
                            const shortType = getShortTrainType(train.Type, train.No);
                            const finalColor = isSuspendedSegment ? '#444444' : baseColor;
                            const finalWidth = isSuspendedSegment ? 1.5 : lineWidth;
                            const finalType = isSuspendedSegment ? 'dashed' : 'solid';
                            const finalOpacity = isSuspendedSegment ? 0.4 : opacity;
                            
                            seriesData.push({
                                name: `${shortType} ${train.No}次 (已行駛)${pathSegments.length > 1 ? ` - 段${segmentIndex+1}` : ''}`,
                                type: 'line',
                                triggerLineEvent: true,
                                data: pastStops,
                                symbol: isSuspendedSegment ? 'rect' : 'circle',
                                symbolSize: searchVal === String(train.No) ? 8 : (isSuspendedSegment ? 4 : 5), 
                                showSymbol: isSuspendedSegment || searchVal === String(train.No), 
                                emphasis: { focus: 'series', lineStyle: { width: 6 } },
                                endLabel: { show: searchVal === String(train.No), formatter: String(train.No), color: 'inherit', fontSize: 14, fontWeight: 'bold', distance: 6 },
                                z: zIndex,
                                lineStyle: { color: finalColor, width: finalWidth, type: finalType, opacity: finalOpacity, shadowBlur: isSuspendedSegment ? 0 : shadowBlur, shadowColor: shadowColor },
                                itemStyle: { color: finalColor, opacity: finalOpacity },
                                tooltip: {
                                    formatter: createTooltipFormatter(train, delayMins, isSuspendedSegment, finalColor, '', '')
                                }
                            });
                        }

                        // 渲染未來路段 (預計延遲 - 虛線)
                        if (futureStops.length > 1) {
                            const shortType = getShortTrainType(train.Type, train.No);
                            const finalColor = isSuspendedSegment ? '#444444' : baseColor;
                            const finalWidth = isSuspendedSegment ? 1.5 : lineWidth;
                            const finalType = isSuspendedSegment ? 'dashed' : 'dashed';
                            const finalOpacity = isSuspendedSegment ? 0.4 : opacity;

                            seriesData.push({
                                name: `${shortType} ${train.No}次 (預估延遲)${pathSegments.length > 1 ? ` - 段${segmentIndex+1}` : ''}`,
                                type: 'line',
                                triggerLineEvent: true,
                                data: futureStops,
                                symbol: isSuspendedSegment ? 'rect' : 'circle',
                                symbolSize: searchVal === String(train.No) ? 8 : (isSuspendedSegment ? 4 : 5), 
                                showSymbol: isSuspendedSegment || searchVal === String(train.No), 
                                emphasis: { focus: 'series', lineStyle: { width: 6 } },
                                endLabel: { show: searchVal === String(train.No), formatter: String(train.No), color: 'inherit', fontSize: 14, fontWeight: 'bold', distance: 6 },
                                z: zIndex + 1, 
                                lineStyle: { color: finalColor, width: finalWidth, type: finalType, opacity: finalOpacity, shadowBlur: isSuspendedSegment ? 0 : shadowBlur, shadowColor: shadowColor },
                                itemStyle: { color: finalColor, opacity: finalOpacity },
                                tooltip: {
                                    formatter: createTooltipFormatter(train, delayMins, isSuspendedSegment, finalColor, '(未來路段)', '預計')
                                }
                            });
                        }
                    } else {
                        // 無延遲，或非今天：整條實線
                        const shortType = getShortTrainType(train.Type, train.No);
                        const finalColor = isSuspendedSegment ? '#444444' : baseColor;
                        const finalWidth = isSuspendedSegment ? 1.5 : lineWidth;
                        const finalType = isSuspendedSegment ? 'dashed' : 'solid';
                        const finalOpacity = isSuspendedSegment ? 0.4 : opacity;

                        seriesData.push({
                            name: `${shortType} ${train.No}次${pathSegments.length > 1 ? ` - 段${segmentIndex+1}` : ''}`,
                            type: 'line',
                            triggerLineEvent: true,
                            data: activePathData,
                            symbol: isSuspendedSegment ? 'rect' : 'circle',
                            symbolSize: searchVal === String(train.No) ? 8 : (isSuspendedSegment ? 4 : 5), 
                            showSymbol: isSuspendedSegment || searchVal === String(train.No), 
                            emphasis: { focus: 'series', lineStyle: { width: 6 } },
                            endLabel: { show: searchVal === String(train.No), formatter: String(train.No), color: 'inherit', fontSize: 14, fontWeight: 'bold', distance: 6 },
                            z: zIndex,
                            lineStyle: { color: finalColor, width: finalWidth, type: finalType, opacity: finalOpacity, shadowBlur: isSuspendedSegment ? 0 : shadowBlur, shadowColor: shadowColor },
                            itemStyle: { color: finalColor, opacity: finalOpacity },
                            tooltip: {
                                formatter: createTooltipFormatter(train, delayMins, isSuspendedSegment, finalColor, '', '')
                            }
                        });
                    }
                });
            });

            // 反轉 Y 軸分類，確保起點車站在上方
            const yAxisData = [...activeStations].reverse();
            
            // 處理即時通阻的封鎖區間 (markArea)
            if (globalAlerts && globalAlerts.length > 0) {
                let markAreaAreas = [];
                globalAlerts.forEach(alert => {
                    const desc = String(alert.Description || "");
                    if (desc.includes("恢復行駛") || desc.includes("恢復通車") || desc.includes("已正常通車") || desc.includes("雙線通車")) return;
                    
                    const segmentRegex = /([\u4e00-\u9fff]+)\s*(?:至|＝|=|與|⇄)\s*([\u4e00-\u9fff]+)\s*間/g;
                    let segmentMatch;
                    while ((segmentMatch = segmentRegex.exec(desc)) !== null) {
                        let start = segmentMatch[1].replace(/站$/g, "").trim();
                        let end = segmentMatch[2].replace(/站$/g, "").trim();
                        if (desc.includes("不通") || desc.includes("中斷") || desc.includes("停駛") || desc.includes("坍方") || desc.includes("封閉")) {
                            if (yAxisData.includes(start) && yAxisData.includes(end)) {
                                markAreaAreas.push([
                                    { yAxis: start, name: '❌ ' + (alert.Title || '路線封鎖') },
                                    { yAxis: end }
                                ]);
                            }
                        }
                    }
                });

                if (markAreaAreas.length > 0) {
                    seriesData.push({
                        name: '通阻封鎖區間',
                        type: 'line',
                        markArea: {
                            itemStyle: { color: 'rgba(255, 71, 87, 0.15)' },
                            label: { position: 'inside', color: '#ff4757', fontWeight: 'bold', fontSize: 16 },
                            data: markAreaAreas
                        }
                    });
                }
            }

            // 決定 X 軸視野 (Auto-zoom)
            let viewMin, viewMax;
            let searchFoundInLine = false;

            if (searchVal !== "") {
                if (globalSearchedTimes.length > 0) {
                    searchFoundInLine = true;
                    const minTime = Math.min(...globalSearchedTimes);
                    const maxTime = Math.max(...globalSearchedTimes);
                    // 將畫面置中於該車次的運行時間，前後保留 1 小時
                    viewMin = minTime - (1 * 3600 * 1000);
                    viewMax = maxTime + (1 * 3600 * 1000);
                } else {
                    // 若當前線路無此車次，檢查是否在全域時刻表中有此車
                    const trainExists = globalTimetable.some(t => String(t.No) === searchVal);
                    const statusEl = document.getElementById('loading-status');
                    statusEl.classList.remove('success');
                    statusEl.style.opacity = '1';
                    if (trainExists) {
                        statusEl.style.borderColor = 'rgba(255, 165, 2, 0.5)';
                        statusEl.style.background = 'rgba(255, 165, 2, 0.2)';
                        statusEl.style.color = '#ffa502';
                        statusEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> 車次 ${escapeHtml(searchVal)} 未行經當前線路`;
                    } else {
                        statusEl.style.borderColor = 'rgba(255, 71, 87, 0.5)';
                        statusEl.style.background = 'rgba(255, 71, 87, 0.2)';
                        statusEl.style.color = '#ff4757';
                        statusEl.innerHTML = `<i class="fas fa-times-circle"></i> 查無車次 ${escapeHtml(searchVal)}`;
                    }
                    if (window.searchWarningTimer) clearTimeout(window.searchWarningTimer);
                    window.searchWarningTimer = setTimeout(() => { statusEl.style.opacity = '0'; }, 4000);
                }
            }

            if (!searchFoundInLine) {
                if (isToday) {
                    const now = Date.now();
                    viewMin = now - (1 * 3600 * 1000);
                    viewMax = now + (3 * 3600 * 1000);
                } else {
                    const baseTime = new Date(`${dateStr}T00:00:00+08:00`).getTime();
                    viewMin = baseTime + (6 * 3600 * 1000);
                    viewMax = baseTime + (12 * 3600 * 1000);
                }
            }

            // 🎯 新增一條垂直的「現在時間基準線」，比對任何列車與此垂直紅線的交點，即為該列車在現在那一刻所在的車站位置
            if (isToday) {
                const now = new Date();
                const nowStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                seriesData.push({
                    name: '現在時間',
                    type: 'line',
                    data: [],
                    markLine: {
                        symbol: ['none', 'none'],
                        label: {
                            show: true,
                            formatter: `現在時間 ${nowStr}`,
                            position: 'end',
                            color: '#ff4757',
                            fontSize: 12,
                            fontWeight: 'bold',
                            backgroundColor: 'rgba(20, 20, 26, 0.95)',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            padding: [6, 10],
                            borderRadius: 6
                        },
                        lineStyle: {
                            color: '#ff4757',
                            type: 'solid',
                            width: 2,
                            shadowColor: 'rgba(255, 71, 87, 0.5)',
                            shadowBlur: 10
                        },
                        data: [{ xAxis: Date.now() }]
                    }
                });
            }

            const option = {
                backgroundColor: '#0f0f12',
                animation: false, 
                tooltip: { 
                    trigger: 'item',
                    backgroundColor: 'rgba(26, 26, 32, 0.95)',
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    textStyle: { color: '#f1f2f6', fontFamily: 'inherit' }
                },
                dataZoom: [
                    { type: 'inside', xAxisIndex: 0, filterMode: 'none', startValue: viewMin, endValue: viewMax }, 
                    { type: 'inside', yAxisIndex: 0, filterMode: 'none' }, 
                    { type: 'slider', xAxisIndex: 0, bottom: 10, height: 20, borderColor: '#26262b', textStyle: { color: '#fff' }, startValue: viewMin, endValue: viewMax },
                    { type: 'slider', yAxisIndex: 0, filterMode: 'none', right: 15, width: 20, borderColor: '#26262b', textStyle: { color: '#fff' } }
                ],
                grid: { top: 60, right: 55, bottom: 35, left: 80 },
                xAxis: {
                    type: 'time',
                    position: 'top', // 時間軸顯示在上方
                    interval: 5 * 60 * 1000, // 強制每 5 分鐘畫一條垂直線
                    splitLine: { show: true, lineStyle: { color: 'rgba(255, 255, 255, 0.15)' } }, 
                    axisLabel: { formatter: '{HH}:{mm}', color: '#a4b0be', hideOverlap: true }
                },
                yAxis: {
                    type: 'category',
                    data: yAxisData,
                    splitLine: { show: true, lineStyle: { color: 'rgba(255, 255, 255, 0.15)' } },
                    axisLabel: { color: '#f1f2f6', fontSize: 13, fontWeight: 'bold' }
                },
                series: seriesData
            };

            myChart.setOption(option, true);
        };

        // 關閉側邊面板
        const closeSidePanel = () => {
            const panel = document.getElementById('side-panel');
            panel.classList.remove('active');
            
            // 清除搜尋狀態並恢復全網圖
            const searchInput = document.getElementById('train-search');
            if (searchInput.value !== '') {
                searchInput.value = '';
                renderChart(document.getElementById('date-picker').value);
            }
        };

        // 顯示列車詳細資訊面板
        const showTrainDetails = (trainNo) => {
            const train = globalTimetable.find(t => String(t.No) === String(trainNo));
            if (!train) return;

            const panel = document.getElementById('side-panel');
            const titleEl = document.getElementById('sp-title');
            const routeEl = document.getElementById('sp-route');
            const bodyEl = document.querySelector('.sp-body');

            const trainColor = getTrainColor(train.Type, train.No);
            const shortType = getShortTrainType(train.Type, train.No);
            titleEl.innerHTML = `<span style="color:${trainColor}"><span style="font-family:'Outfit'">${train.No}</span>次 ${shortType}</span>`;
            
            // 處理路線與狀態
            let lineText = '';
            if (train.Line === 1) lineText = '<span style="color:#2ed573; font-size:0.8em; border: 1px solid #2ed573; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">山線</span>';
            else if (train.Line === 2) lineText = '<span style="color:#4facfe; font-size:0.8em; border: 1px solid #4facfe; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">海線</span>';
            else if (train.Line === 3) lineText = '<span style="color:#e056fd; font-size:0.8em; border: 1px solid #e056fd; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">成追線</span>';
            
            let suspText = train.Susp === 1 || train.Susp === 2 ? '<span style="color:#ff4757; font-size:0.8em; border: 1px solid #ff4757; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">停駛</span>' : '';
            
            routeEl.innerHTML = `<i class="fas fa-map-marker-alt" style="color:#a4b0be;"></i> ${train.StartStation || train.Start} <i class="fas fa-arrow-right" style="margin: 0 4px; font-size: 0.8em; color: rgba(255,255,255,0.2)"></i> ${train.EndStation || train.Dest} ${lineText} ${suspText}`;
            
            // 如果有備註，加在下方
            let noteHtml = '';
            if (train.Note && train.Note.trim() !== '') {
                noteHtml = `<div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; margin: 10px 20px 0; font-size: 0.85em; color: #a4b0be; border-left: 3px solid #4facfe;">
                                <i class="fas fa-info-circle"></i> 備註：${escapeHtml(train.Note)}
                            </div>`;
            }

            const isDelayed = globalLiveMap[train.No] && globalLiveMap[train.No].DelayTime > 0;
            const delayMins = isDelayed ? globalLiveMap[train.No].DelayTime : 0;
            const nowTime = Date.now();
            const datePickerVal = document.getElementById('date-picker').value;
            const isToday = (datePickerVal === getTwTodayString());

            let html = noteHtml + '<div class="timeline" style="margin-top: 20px;">';
            let firstStopTimeMins = null;
            let pastCount = 0;
            const totalCount = train.Stops.length;

            train.Stops.forEach((stop, index) => {
                const arrStr = stop.Arr;
                const depStr = stop.Dep;
                const timeStrForCalc = depStr || arrStr;
                if (!timeStrForCalc) return;
                
                const [h, m] = timeStrForCalc.split(':').map(Number);
                if (index === 0) firstStopTimeMins = h * 60 + m; 
                const timeVal = parseTimeToTimestamp(timeStrForCalc, datePickerVal, firstStopTimeMins);
                
                let isPast = false;
                let delayedClass = '';
                let delayStatusHtml = '';

                // 計算加上延遲後的實際時間
                const getActualTimeStr = (baseTimeStr) => {
                    if (!baseTimeStr) return '';
                    const ms = parseTimeToTimestamp(baseTimeStr, datePickerVal, firstStopTimeMins) + delayMins * 60000;
                    const d = new Date(ms);
                    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                };

                let expectedHtml = '';
                let actualHtml = '';

                if (index === 0) {
                    expectedHtml = `${depStr}`;
                    actualHtml = `${getActualTimeStr(depStr)}`;
                } else if (index === train.Stops.length - 1) {
                    expectedHtml = `${arrStr}`;
                    actualHtml = `${getActualTimeStr(arrStr)}`;
                } else if (arrStr === depStr) {
                    expectedHtml = `${arrStr}`;
                    actualHtml = `${getActualTimeStr(arrStr)}`;
                } else {
                    expectedHtml = `${arrStr}<br>${depStr}`;
                    actualHtml = `${getActualTimeStr(arrStr)}<br>${getActualTimeStr(depStr)}`;
                }

                if (isToday) {
                    if (timeVal <= nowTime) {
                        isPast = true;
                        pastCount++;
                    }
                    if (stop.SuspendedFlag === 1) {
                        delayStatusHtml = `<div class="ontime-tag" style="background:#8b0000; color:#ffffff; font-weight:bold;">停駛</div>`;
                        expectedHtml = `<del style="opacity: 0.5;">${expectedHtml}</del>`;
                        actualHtml = '';
                    } else if (delayMins > 0) {
                        delayStatusHtml = `<div class="delay-tag ${isPast ? 'past' : ''}">晚 ${delayMins} 分</div>`;
                        delayedClass = 'delayed';
                        expectedHtml = `<del style="opacity: 0.6;">${expectedHtml}</del>`;
                    } else {
                        delayStatusHtml = `<div class="ontime-tag">準點</div>`;
                        actualHtml = ''; // 準點不顯示額外的紅字
                    }
                } else {
                    actualHtml = '';
                }

                html += `
                    <div class="timeline-item ${isPast ? 'past' : ''} ${delayedClass}">
                        <div class="tl-time">
                            <div class="expected">${expectedHtml}</div>
                            ${actualHtml !== '' ? `<div class="actual">${actualHtml}</div>` : ''}
                        </div>
                        <div class="tl-node"></div>
                        <div class="tl-content">
                            <div class="station-name">${stop.Name}</div>
                            ${delayStatusHtml}
                        </div>
                    </div>
                `;
            });

            // 計算與更新行駛進度條
            const progressWrapper = document.getElementById('sp-progress-wrapper');
            const progressBar = document.getElementById('sp-progress-bar');
            const progressPercentText = document.getElementById('sp-progress-percent');
            const progressStationsText = document.getElementById('sp-progress-stations');
            
            if (isToday && totalCount > 0) {
                const percent = Math.min(100, Math.round((pastCount / totalCount) * 100));
                progressBar.style.width = `${percent}%`;
                progressPercentText.textContent = `行程進度 ${percent}%`;
                progressStationsText.textContent = `${pastCount} / ${totalCount} 站`;
                progressWrapper.style.display = 'block';
            } else {
                progressWrapper.style.display = 'none';
            }

            html += '</div>'; // close timeline div
            bodyEl.innerHTML = html;
            panel.classList.add('active');
        };

        const updateAlertsMarquee = (alerts) => {
            const marqueeContainer = document.getElementById('alerts-marquee');
            const marqueeText = document.getElementById('alerts-marquee-text');
            const marqueeBadge = document.getElementById('alerts-marquee-badge');
            
            if (!alerts || alerts.length === 0) {
                marqueeContainer.style.display = 'none';
                return;
            }
            
            // 判斷是否為正常狀態的輔助函式
            const isAlertNormal = (a) => a.Title.includes('正常') || a.Title.includes('恢復');
            
            // 挑出真正的異常通報
            const abnormalAlerts = alerts.filter(a => !isAlertNormal(a));
            
            // 如果完全沒有異常通報，代表目前全線正常
            const isAllNormal = abnormalAlerts.length === 0;
            
            if (isAllNormal) {
                marqueeContainer.style.background = 'rgba(46, 213, 115, 0.15)';
                marqueeContainer.style.borderBottom = '1px solid rgba(46, 213, 115, 0.3)';
                marqueeContainer.style.color = '#2ed573';
                marqueeBadge.style.borderRight = '1px solid rgba(46, 213, 115, 0.5)';
                marqueeBadge.innerHTML = '✅ 營運通阻狀態';
            } else {
                marqueeContainer.style.background = 'rgba(255, 71, 87, 0.15)';
                marqueeContainer.style.borderBottom = '1px solid rgba(255, 71, 87, 0.3)';
                marqueeContainer.style.color = '#ff4757';
                marqueeBadge.style.borderRight = '1px solid rgba(255, 71, 87, 0.5)';
                marqueeBadge.innerHTML = '⚠️ 營運通阻狀態';
            }
            
            // 顯示邏輯：如果有異常，就「過濾掉」那些自打嘴巴的「全線營運正常」，避免混淆
            const alertsToShow = isAllNormal ? alerts : abnormalAlerts;
            
            let html = '';
            alertsToShow.forEach(a => {
                const normal = isAlertNormal(a);
                const icon = normal ? '✅' : '⚠️';
                const color = normal ? '#2ed573' : '#ff4757';
                html += `<span style="margin-right: 40px;"><span style="color: ${color};">[${icon} ${escapeHtml(a.Title)}]</span> ${escapeHtml(a.Description)}</span>`;
            });
            // CSS marquee: 兩份內容交替滾動，實現無縫循環
            marqueeText.innerHTML = `<div class="marquee-copy">${html}</div><div class="marquee-copy">${html}</div>`;
            const charCount = marqueeText.textContent.length / 2;
            marqueeText.style.animationDuration = `${Math.max(15, Math.round(charCount * 0.3))}s`;
            marqueeContainer.style.display = 'flex';
        };

        // 設定每 60 秒的背景刷新定時器
        const startAutoRefresh = () => {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);

            autoRefreshTimer = setInterval(async () => {
                const datePicker = document.getElementById('date-picker');
                // 只有日期選定為「今天」時，才有即時位置與誤點更新的必要
                if (datePicker.value === getTwTodayString()) {
                    const statusEl = document.getElementById('loading-status');
                    try {
                        statusEl.classList.remove('success');
                        statusEl.style.opacity = '1';
                        statusEl.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                        statusEl.style.background = 'rgba(255, 165, 2, 0.1)';
                        statusEl.style.color = '#ffa502';
                        statusEl.innerHTML = `<i class="fas fa-sync fa-spin"></i> <span id="status-text">更新即時位置中...</span>`;
                        
                        const [liveRes, alertsRes] = await Promise.all([
                            fetch(`${API_BASE}/api/live`),
                            fetch(`${API_BASE}/api/alerts`)
                        ]);
                        const liveData = await liveRes.json();
                        globalLiveMap = {};
                        liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                        
                        try {
                            globalAlerts = await alertsRes.json();
                            updateAlertsMarquee(globalAlerts);
                        } catch(e) {}
                        
                        renderChart(datePicker.value);
                        
                        statusEl.classList.add('success');
                        statusEl.innerHTML = `<i class="fas fa-check"></i> 即時位置已更新`;
                        setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
                    } catch (e) {
                        console.error("每分鐘更新即時位置失敗:", e);
                        statusEl.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                        statusEl.style.background = 'rgba(255, 71, 87, 0.1)';
                        statusEl.style.color = '#ff4757';
                        statusEl.innerHTML = `<i class="fas fa-exclamation-triangle"></i> 位置更新失敗`;
                        setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
                    }
                }
            }, 60000); // 60 秒
        };

        // 從 API 下載資料並更新全域變數
        const loadData = async (dateStr) => {
            const statusEl = document.getElementById('loading-status');
            
            // 清除之前的自動更新定時器
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }

            // 隱藏先前的錯誤覆蓋層
            document.getElementById('error-overlay').style.display = 'none';

            try {
                myChart.clear(); 
                statusEl.classList.remove('success');
                statusEl.style.opacity = '1';
                statusEl.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                statusEl.style.background = 'rgba(255, 165, 2, 0.1)';
                statusEl.style.color = '#ffa502';
                statusEl.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span id="status-text">下載時刻表中...</span>`;
                
                const textEl = document.getElementById('status-text');

                // 1. 抓取該日時刻表
                const res = await fetch(`${API_BASE}/api/timetable/daily?date=${dateStr}`);
                if (!res.ok) throw new Error("無該日時刻表資料");
                globalTimetable = await res.json();
                
                // 2. 只有選擇「今天」才抓取即時誤點資料
                if (dateStr === getTwTodayString()) {
                    textEl.innerText = "抓取即時動態與通阻中...";
                    const [liveRes, alertsRes] = await Promise.all([
                        fetch(`${API_BASE}/api/live`),
                        fetch(`${API_BASE}/api/alerts`)
                    ]);
                    const liveData = await liveRes.json();
                    globalLiveMap = {};
                    liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                    try {
                        globalAlerts = await alertsRes.json();
                        updateAlertsMarquee(globalAlerts);
                    } catch(e) {}
                } else {
                    globalLiveMap = {}; 
                    document.getElementById('alerts-marquee').style.display = 'none';
                }

                textEl.innerText = "渲染圖表中...";
                renderChart(dateStr);
                
                statusEl.classList.add('success');
                statusEl.innerHTML = `<i class="fas fa-check"></i> 載入完成 (共 ${globalTimetable.length} 班次)`;
                
                // 載入成功後，如果是今天，則重新啟動自動更新定時器
                if (dateStr === getTwTodayString()) {
                    startAutoRefresh();
                }

                setTimeout(() => { 
                    statusEl.style.opacity = '0'; 
                    statusEl.style.transition = 'opacity 1s'; 
                }, 3000);

            } catch (err) {
                console.error(err);
                globalTimetable = [];
                statusEl.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                statusEl.style.background = 'rgba(255, 71, 87, 0.1)';
                statusEl.style.color = '#ff4757';
                statusEl.innerHTML = `<i class="fas fa-times"></i> 載入失敗: ${escapeHtml(err.message)}`;
                // 顯示錯誤重試覆蓋層
                const errorOverlay = document.getElementById('error-overlay');
                document.getElementById('error-msg').textContent = err.message || '未知錯誤';
                errorOverlay.style.display = 'flex';
            }
        };

        // 綁定事件監聽器
        document.addEventListener('DOMContentLoaded', () => {
            const lineSelect = document.getElementById('line-select');
            const datePicker = document.getElementById('date-picker');
            const searchInput = document.getElementById('train-search');

            // 預設設定為今天
            const todayStr = getTwTodayString();
            datePicker.value = todayStr;
            
            // 限制日期選擇範圍為：今天至未來 60 天
            datePicker.min = todayStr;
            
            const todayDate = new Date(Date.now() + 8 * 3600000);
            const maxDate = new Date(todayDate);
            maxDate.setDate(todayDate.getDate() + 60);
            datePicker.max = maxDate.toISOString().split('T')[0];
            
            // 首次載入資料
            loadData(datePicker.value);

            // 當日期改變時，重新下載資料
            datePicker.addEventListener('change', (e) => {
                loadData(e.target.value);
            });

            // 當線路切換時，進行前端 0 延遲過濾與重繪
            lineSelect.addEventListener('change', () => {
                renderChart(datePicker.value);
            });

            // 當搜尋框內容改變時，重新繪製 (加 debounce 避免每按一鍵都觸發完整重繪)
            let _searchDebounceTimer = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(_searchDebounceTimer);
                _searchDebounceTimer = setTimeout(() => {
                    renderChart(datePicker.value);
                }, 200);
            });

            // 僅顯示延誤 Toggle Badge 控制邏輯
            window.toggleDelayOnlyFilter = () => {
                const checkbox = document.getElementById('delay-only-checkbox');
                const toggleBadge = document.getElementById('delay-toggle-btn');
                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) {
                    toggleBadge.classList.add('active');
                } else {
                    toggleBadge.classList.remove('active');
                }
                renderChart(document.getElementById('date-picker').value);
            };

            // 綁定 ECharts 點擊事件，顯示側邊面板
            myChart.on('click', function(params) {
                if (params.seriesName === '現在時間') return;
                
                // seriesName 格式範例："新自強 408次" 或 "新自強 408次 (已行駛)"
                const match = params.seriesName.match(/(\d+)次/);
                if (match && match[1]) {
                    const trainNo = match[1];
                    showTrainDetails(trainNo);
                    
                    // 將點擊的車次設為搜尋目標，觸發 Ghost Line 顯示
                    const searchInput = document.getElementById('train-search');
                    if (searchInput.value !== trainNo) {
                        searchInput.value = trainNo;
                        renderChart(document.getElementById('date-picker').value);
                    }
                }
            });

            // 點擊空白處隱藏側邊面板
            myChart.getZr().on('click', function(params) {
                // 如果沒有點擊在圖表元素上
                if (!params.target) {
                    closeSidePanel();
                }
            });

            // 讓圖表隨視窗縮放
            window.addEventListener('resize', () => { myChart.resize(); });
        });

        // 放大與縮小 X 軸時間範圍
        const handleZoom = (direction) => {
            const option = myChart.getOption();
            if (!option || !option.dataZoom || option.dataZoom.length === 0) return;
            
            // X 軸在 index 0 
            const dz = option.dataZoom[0];
            const currentMin = dz.startValue;
            const currentMax = dz.endValue;
            const range = currentMax - currentMin;
            
            let newMin, newMax;
            if (direction === 'in') {
                // 放大：範圍縮小 30% (往中間靠攏)
                newMin = currentMin + range * 0.15;
                newMax = currentMax - range * 0.15;
            } else {
                // 縮小：範圍放大 30% (往兩側展開)
                newMin = currentMin - range * 0.15;
                newMax = currentMax + range * 0.15;
            }
            
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomIndex: 0,
                startValue: newMin,
                endValue: newMax
            });
        };

        // 放大與縮小 Y 軸車站範圍 (拉開/壓縮車站間距)
        const handleZoomY = (direction) => {
            const option = myChart.getOption();
            if (!option || !option.dataZoom || option.dataZoom.length < 2) return;
            
            // Y 軸在 index 1
            const dz = option.dataZoom[1];
            const totalCount = option.yAxis[0].data.length;
            
            let currentMin = dz.startValue !== undefined ? dz.startValue : 0;
            let currentMax = dz.endValue !== undefined ? dz.endValue : totalCount - 1;
            
            const range = currentMax - currentMin;
            if (range <= 2 && direction === 'in') return; // 避免縮到只剩 2 站
            
            let newMin, newMax;
            if (direction === 'in') {
                // 放大：顯示更少車站 (範圍收縮 20%)
                newMin = Math.round(currentMin + range * 0.1);
                newMax = Math.round(currentMax - range * 0.1);
            } else {
                // 縮小：顯示更多車站 (範圍擴張 20%)
                newMin = Math.max(0, Math.round(currentMin - range * 0.1));
                newMax = Math.min(totalCount - 1, Math.round(currentMax + range * 0.1));
            }
            
            if (newMin >= newMax) {
                newMin = Math.max(0, newMax - 2);
            }
            
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomIndex: 1,
                startValue: newMin,
                endValue: newMax
            });
        };

        // 重設 X 軸與 Y 軸為當天預設視野
        const resetZoom = () => {
            const datePicker = document.getElementById('date-picker');
            if (!datePicker) return;
            const dateStr = datePicker.value;
            const isToday = dateStr === getTwTodayString();
            
            let viewMin, viewMax;
            const searchVal = document.getElementById('train-search').value.trim();
            
            let searchFound = false;
            if (searchVal !== "" && globalSearchedTimes && globalSearchedTimes.length > 0) {
                searchFound = true;
                const minTime = Math.min(...globalSearchedTimes);
                const maxTime = Math.max(...globalSearchedTimes);
                viewMin = minTime - (1 * 3600 * 1000);
                viewMax = maxTime + (1 * 3600 * 1000);
            }
            
            if (!searchFound) {
                if (isToday) {
                    const now = Date.now();
                    viewMin = now - (1 * 3600 * 1000);
                    viewMax = now + (3 * 3600 * 1000);
                } else {
                    const baseTime = new Date(`${dateStr}T00:00:00+08:00`).getTime();
                    viewMin = baseTime + (6 * 3600 * 1000);
                    viewMax = baseTime + (12 * 3600 * 1000);
                }
            }
            
            // 重設 X 軸
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomIndex: 0,
                startValue: viewMin,
                endValue: viewMax
            });

            // 重設 Y 軸 (顯示所有車站)
            const option = myChart.getOption();
            if (option && option.yAxis && option.yAxis[0]) {
                const totalCount = option.yAxis[0].data.length;
                myChart.dispatchAction({
                    type: 'dataZoom',
                    dataZoomIndex: 1,
                    startValue: 0,
                    endValue: totalCount - 1
                });
            }
        };
    </script>
</body>
</html>
