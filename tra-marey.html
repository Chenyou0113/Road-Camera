        // 預建 站名→所屬線路 查找表 (查表 O(1))
        const STATION_LINE_MAP = new Map();
        (function buildStationLineMap() {
            for (const [key, cfg] of Object.entries(LINE_CONFIG)) {
                cfg.stations.forEach(st => {
                    if (!STATION_LINE_MAP.has(st)) STATION_LINE_MAP.set(st, []);
                    STATION_LINE_MAP.get(st).push(key);
                });
            }
        })();

        // 八大核心跨線路接點定義
        const JUNCTIONS = [
            { name: "八堵", lines: ["west-north", "yilan"] },
            { name: "竹南", lines: ["west-north", "west-mountain", "west-sea"] },
            { name: "彰化", lines: ["west-mountain", "west-sea", "west-south"] },
            { name: "高雄", lines: ["west-south", "pingtung"] },
            { name: "枋寮", lines: ["pingtung", "south-link"] },
            { name: "臺東", lines: ["south-link", "taitung"] },
            { name: "花蓮", lines: ["taitung", "north-link"] },
            { name: "蘇澳新", lines: ["north-link", "yilan"] }
        ];

        // 統一車種規則表 (Single Source of Truth)
        const TRAIN_RULES = [
            { test: (no, t) => no === 4666 || no === 4667, color: '#bdc3c7', label: '蒸汽火車' },
            { test: (no, t) => (no >= 6001 && no <= 6099) || (no >= 6701 && no <= 6799), color: '#e0821d', label: '鳴日號' },
            { test: (no, t) => no === 6652 || no === 6655, color: '#7edece', label: '海風號' },
            { test: (no, t) => [6631, 6632, 6633, 6676, 6677].includes(no), color: '#eab308', label: '山嵐號' },
            { test: (no, t) => no === 1 || no === 2, color: '#f774ba', label: '環島之星' },
            { test: (no, t) => no >= 6801 && no <= 6899, color: '#7db583', label: '入伍專車' },
            { test: (no, t) => t.includes('新自強') || t.includes('EMU3000') || t.includes('3000'), color: '#888888', label: '新自強' },
            { test: (no, t) => t.includes('太魯閣'), color: '#e6a822', label: '太魯閣' },
            { test: (no, t) => t.includes('普悠瑪'), color: '#de3923', label: '普悠瑪' },
            { test: (no, t) => t.includes('自強'), color: '#eb7405', label: '自強' },
            { test: (no, t) => t.includes('莒光'), color: '#9c612a', label: '莒光' },
            { test: (no, t) => t.includes('區間快'), color: '#6ac242', label: '區間快' },
            { test: (no, t) => t.includes('區間') || t.includes('復興'), color: '#48c5db', label: '區間' },
            { test: (no, t) => t.includes('藍皮普快') || t.includes('普快'), color: '#5047d1', label: '普快' },
            { test: (no, t) => t.includes('專車') || t.includes('郵輪') || t.includes('包車'), color: '#a3175d', label: '專車' }
        ];

        const getTrainRule = (type, trainNo) => {
            const no = Number(trainNo || 0);
            const t = String(type || '');
            for (const rule of TRAIN_RULES) {
                if (rule.test(no, t)) return rule;
            }
            return { color: '#a4b0be', label: t.split('(')[0] || t };
        };

        const getTrainColor = (type, trainNo) => getTrainRule(type, trainNo).color;
        const getShortTrainType = (type, trainNo) => getTrainRule(type, trainNo).label;

        // 工具函式
        const getTwTodayString = () => new Date(Date.now() + 8 * 3600000).toISOString().split('T')[0];

        const escapeHtml = (str) => {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        const debounce = (fn, delay = 150) => {
            let timer = null;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        };

        // 全域 DOM 元素快取物件
        const els = {};
        const initEls = () => {
            els.lineSelect = document.getElementById('line-select');
            els.datePicker = document.getElementById('date-picker');
            els.searchInput = document.getElementById('train-search');
            els.clearSearch = document.getElementById('clear-search');
            els.typeFilter = document.getElementById('type-filter');
            els.delayToggleBtn = document.getElementById('delay-toggle-btn');
            els.delayOnlyCheckbox = document.getElementById('delay-only-checkbox');
            els.alertBar = document.getElementById('alert-bar');
            els.alertCount = document.getElementById('alert-count');
            els.alertIconMain = document.getElementById('alert-icon-main');
            els.alertsMarqueeText = document.getElementById('alerts-marquee-text');
            els.openAlerts = document.getElementById('open-alerts');
            els.statTotal = document.getElementById('stat-total');
            els.statNormal = document.getElementById('stat-normal');
            els.statNormalRate = document.getElementById('stat-normal-rate');
            els.statDelay = document.getElementById('stat-delay');
            els.statDelayRate = document.getElementById('stat-delay-rate');
            els.statSuspended = document.getElementById('stat-suspended');
            els.statSuspendedRate = document.getElementById('stat-suspended-rate');
            els.sidePanel = document.getElementById('side-panel');
            els.spTitle = document.getElementById('sp-title');
            els.spRoute = document.getElementById('sp-route');
            els.spStatusBadge = document.getElementById('sp-status-badge');
            els.spProgressText = document.getElementById('sp-progress-text');
            els.spProgressBar = document.getElementById('sp-progress-bar');
            els.spBody = document.querySelector('#side-panel .sp-body');
            els.spClose = document.querySelector('#side-panel .sp-close');
            els.loadingStatus = document.getElementById('loading-status');
            els.errorOverlay = document.getElementById('error-overlay');
            els.errorMsg = document.getElementById('error-msg');
            els.retryBtn = document.querySelector('#error-overlay .retry-btn');
            els.alertsModalOverlay = document.getElementById('alerts-modal-overlay');
            els.alertsModalBox = document.getElementById('alerts-modal-box');
            els.echartsContainer = document.getElementById('echarts-container');
            els.jumpNowBtn = document.getElementById('jump-now-btn');
            els.zoomInBtn = document.getElementById('zoom-in-btn');
            els.zoomOutBtn = document.getElementById('zoom-out-btn');
            els.zoomResetBtn = document.getElementById('zoom-reset-btn');
        };

        // 全域狀態與快取
        let globalTimetable = [];
        let globalLiveMap = {};
        let globalAlerts = [];
        let autoRefreshTimer = null;
        let clockInterval = null;
        let nowLineInterval = null;
        let currentAbortController = null;
        let yAxisData = [];

        // 兩層 Map 快取
        const timetableCache = new Map(); // Map<dateStr, timetableData>
        const segmentsCache = new Map();  // Map<`${lineKey}:${trainNo}`, segmentsArray>

        // 針對高 dpr 螢幕進行 Canvas 記憶體優化 (封頂 dpr <= 2) 並開啟髒矩形優化
        const myChart = echarts.init(
            document.getElementById('echarts-container'),
            'dark',
            { devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), useDirtyRect: true }
        );

        const getDelayLevel = (delayMins) => {
            if (delayMins <= 0) return 'on-time';
            if (delayMins <= 5) return 'minor-delay';
            if (delayMins <= 14) return 'delay';
            return 'major-delay';
        };

        const getTrainStatus = (train) => {
            const trainNo = train.No || (train.TrainInfo && train.TrainInfo.TrainNo);
            const live = globalLiveMap[trainNo];
            if (!live) return 'scheduled';
            if (live.SuspendedFlag) return 'suspended';
            return getDelayLevel(live.DelayTime);
        };

        const updateCurrentClock = () => {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            const clockEl = document.getElementById('current-clock');
            if (clockEl) clockEl.textContent = timeStr;
        };

        const updateLastUpdateTime = () => {
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const updateEl = document.getElementById('last-update');
            if (updateEl) updateEl.textContent = `最後更新 ${timeStr}`;
        };

        const updateNowLine = () => {
            if (els.datePicker && els.datePicker.value === getTwTodayString() && globalTimetable && globalTimetable.length > 0) {
                const now = new Date();
                const nowStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                myChart.setOption({
                    series: [{
                        id: 'current-time-line',
                        name: '現在時間',
                        type: 'line',
                        markLine: {
                            silent: true,
                            symbol: ['none', 'none'],
                            lineStyle: { type: 'solid', width: 2, color: THEME.danger },
                            label: { show: true, formatter: `🔴 現在 ${nowStr}`, color: THEME.danger },
                            data: [{ xAxis: Date.now() }]
                        }
                    }]
                });
            }
        };

        const parseTimeToTimestamp = (timeStr, baseDateStr, firstStopTimeMins) => {
            if (!timeStr) return null;
            const [h, m] = timeStr.split(':').map(Number);
            const currentMins = h * 60 + m;
            
            let offsetDay = 0;
            if (firstStopTimeMins !== null && currentMins < firstStopTimeMins - 720) {
                offsetDay = 1;
            }

            const date = new Date(`${baseDateStr}T00:00:00+08:00`);
            date.setDate(date.getDate() + offsetDay);
            date.setHours(h, m, 0, 0);
            return date.getTime();
        };

        const getStationLines = (stationName) => STATION_LINE_MAP.get(stationName) || [];

        const _junctionCache = new Map();
        const findJunctionsBetween = (statA, statB) => {
            const cacheKey = `${statA}|${statB}`;
            if (_junctionCache.has(cacheKey)) return _junctionCache.get(cacheKey);
            const linesA = getStationLines(statA);
            const linesB = getStationLines(statB);
            
            if (linesA.some(l => linesB.includes(l))) {
                return [];
            }
            
            const queue = [];
            const visited = new Set();
            const parent = {};
            
            linesA.forEach(l => {
                queue.push(l);
                visited.add(l);
            });
            
            let foundLine = null;
            while (queue.length > 0) {
                const currLine = queue.shift();
                if (linesB.includes(currLine)) {
                    foundLine = currLine;
                    break;
                }
                
                for (const junc of JUNCTIONS) {
                    if (junc.lines.includes(currLine)) {
                        for (const nextLine of junc.lines) {
                            if (!visited.has(nextLine)) {
                                visited.add(nextLine);
                                parent[nextLine] = { prevLine: currLine, junction: junc.name };
                                queue.push(nextLine);
                            }
                        }
                    }
                }
            }
            
            if (!foundLine) { _junctionCache.set(cacheKey, []); return []; }
            
            const path = [];
            let curr = foundLine;
            while (parent[curr]) {
                path.unshift(parent[curr].junction);
                curr = parent[curr].prevLine;
            }
            _junctionCache.set(cacheKey, path);
            return path;
        };

        const interpolateJunctionStops = (stopA, stopB, junctions) => {
            const path = [stopA.Name, ...junctions, stopB.Name];
            const parseToMins = (tStr) => {
                if (!tStr) return null;
                const [h, m] = tStr.split(':').map(Number);
                return h * 60 + m;
            };
            
            const timesA = parseToMins(stopA.Dep || stopA.Arr);
            let timesB = parseToMins(stopB.Arr || stopB.Dep);
            
            if (timesA === null || timesB === null) return [];
            if (timesB < timesA) timesB += 1440;
            
            const distances = [];
            for (let i = 0; i < path.length - 1; i++) {
                const s1 = path[i];
                const s2 = path[i+1];
                const lines1 = getStationLines(s1);
                const lines2 = getStationLines(s2);
                const sharedLine = lines1.find(l => lines2.includes(l));
                if (sharedLine) {
                    const idx1 = LINE_CONFIG[sharedLine].stations.indexOf(s1);
                    const idx2 = LINE_CONFIG[sharedLine].stations.indexOf(s2);
                    distances.push(Math.abs(idx1 - idx2));
                } else {
                    distances.push(5);
                }
            }
            
            const totalDist = distances.reduce((a, b) => a + b, 0);
            if (totalDist === 0) return [];
            
            const timeRange = timesB - timesA;
            const virtualStops = [];
            let currentDist = 0;

            for (let i = 0; i < junctions.length; i++) {
                currentDist += distances[i];
                const ratio = currentDist / totalDist;
                const juncMins = timesA + timeRange * ratio;
                let normMins = Math.round(juncMins) % 1440;
                if (normMins < 0) normMins += 1440;
                const h = Math.floor(normMins / 60);
                const m = normMins % 60;
                const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`;
                
                virtualStops.push({
                    Seq: 999,
                    SID: "",
                    Name: junctions[i],
                    Arr: timeStr,
                    Dep: timeStr,
                    Susp: stopA.Susp || stopB.Susp || 0
                });
            }
            return virtualStops;
        };

        const createTooltipFormatter = (train, delayMins, isSuspendedSegment, finalColor, titleSuffix, statusPrefix) => {
            const shortType = escapeHtml(getShortTrainType(train.Type, train.No));
            const trainNo = escapeHtml(train.No);
            const safeColor = escapeHtml(finalColor);
            return function(params) {
                const actualTimeMs = params.value[0];
                const schedTimeMs = actualTimeMs - delayMins * 60000;
                const actualTime = new Date(actualTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                const schedTime = new Date(schedTimeMs).toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'});
                let delayStatusText = isSuspendedSegment 
                    ? `<span style="color:${THEME.danger}; font-weight:bold;">❌ 停駛</span>` 
                    : (delayMins > 0 
                        ? `<span style="color:${THEME.danger}; font-weight:bold;">⚠️ ${escapeHtml(statusPrefix || '')}晚 ${delayMins} 分</span>` 
                        : `<span style="color:${THEME.success}; font-weight:bold;">✅ ${escapeHtml(statusPrefix || '')}準點</span>`);
                const displayTitle = titleSuffix 
                    ? `${shortType} ${trainNo}次 ${escapeHtml(titleSuffix)}` 
                    : `${shortType} ${trainNo}次`;
                const stopName = escapeHtml(params.value[1]);
                return `<div style="padding:5px;">
                            <strong style="color:${safeColor}">${displayTitle}</strong><br>
                            📍 <b>${stopName}</b> 站<br>
                            ⏱️ 表訂時間：${schedTime}<br>
                            🕒 實際時間：${actualTime}<br>
                            📊 運行狀況：${delayStatusText}
                        </div>`;
            };
        };

        // URL 狀態同步與還原
        const syncStateToUrl = () => {
            const params = new URLSearchParams(window.location.search);
            if (els.lineSelect && els.lineSelect.value) params.set('line', els.lineSelect.value);
            if (els.datePicker && els.datePicker.value) params.set('date', els.datePicker.value);
            const searchVal = els.searchInput ? els.searchInput.value.trim() : '';
            if (searchVal) params.set('train', searchVal);
            else params.delete('train');
            
            const newUrl = `${window.location.pathname}?${params.toString()}`;
            window.history.replaceState(null, '', newUrl);
        };

        const restoreStateFromUrl = () => {
            const params = new URLSearchParams(window.location.search);
            const line = params.get('line');
            const date = params.get('date');
            const train = params.get('train');

            if (line && LINE_CONFIG[line] && els.lineSelect) els.lineSelect.value = line;
            if (date && els.datePicker) els.datePicker.value = date;
            if (train && els.searchInput) els.searchInput.value = train;
        };

        // 核心 Chart 渲染
        const renderChart = (dateStr) => {
            const lineKey = els.lineSelect.value;
            const activeStations = LINE_CONFIG[lineKey].stations;
            const activeStationSet = new Set(activeStations); // O(1) 站點比對優化
            const searchVal = els.searchInput.value.trim();
            const delayOnly = els.delayOnlyCheckbox.checked;
            const typeFilter = els.typeFilter.value;
            const seriesData = [];
            const isToday = (dateStr === getTwTodayString());
            
            updateStatsDashboard();
            syncStateToUrl();

            // 控制開關: 清除搜尋按鈕的顯示/隱藏
            if (els.clearSearch) {
                els.clearSearch.style.display = searchVal ? 'block' : 'none';
            }

            globalTimetable.forEach(train => {
                // 車種過濾
                if (typeFilter !== 'all') {
                    let match = false;
                    if (typeFilter === '新自強' && train.Type.includes('新自強')) match = true;
                    else if (typeFilter === '自強' && train.Type.includes('自強') && !train.Type.includes('新自強')) match = true;
                    else if (typeFilter === '區間' && (train.Type.includes('區間') || train.Type.includes('復興')) && !train.Type.includes('快')) match = true;
                    else if (typeFilter === '專車' && (train.Type.includes('專車') || train.Type.includes('觀光') || train.Type.includes('商務'))) match = true;
                    else if (train.Type.includes(typeFilter)) match = true;
                    if (!match) return;
                }

                // Segment 快取處理
                const cacheKey = `${lineKey}:${train.No}`;
                let pathSegments = segmentsCache.get(cacheKey);

                if (!pathSegments) {
                    pathSegments = [];
                    let currentSegment = [];
                    let currentSuspState = null;

                    train.Stops.forEach(stop => {
                        const stopName = stop.Name.replace("-環島", "");
                        if (activeStationSet.has(stopName)) {
                            const stopSusp = train.Susp === 1 ? 1 : (stop.Susp || 0);
                            if (currentSegment.length > 0 && currentSuspState !== stopSusp) {
                                pathSegments.push({ stops: currentSegment, susp: currentSuspState });
                                currentSegment = [{ ...stop, Name: stopName }];
                            } else {
                                currentSegment.push({ ...stop, Name: stopName });
                            }
                            currentSuspState = stopSusp;
                        } else {
                            if (currentSegment.length > 1) {
                                pathSegments.push({ stops: currentSegment, susp: currentSuspState });
                            }
                            currentSegment = [];
                            currentSuspState = null;
                        }
                    });
                    if (currentSegment.length > 1) {
                        pathSegments.push({ stops: currentSegment, susp: currentSuspState });
                    }
                    segmentsCache.set(cacheKey, pathSegments);
                }

                const isCoarseTouch = window.matchMedia('(pointer: coarse)').matches;

                // 搜尋高亮與 ShadowBlur Canvas 渲染效能優化 (非高亮車不繪製 shadowBlur)
                let opacity = 0.85;
                let lineWidth = isCoarseTouch ? 2.5 : 1.5;
                let zIndex = 1;
                let shadowBlur = 0;
                let shadowColor = 'transparent';

                const isDelayed = globalLiveMap[train.No] && globalLiveMap[train.No].DelayTime > 0;
                const delayMins = isDelayed ? globalLiveMap[train.No].DelayTime : 0;
                const baseColor = getTrainColor(train.Type, train.No);
                const trainStatus = getTrainStatus(train);

                if (delayOnly && delayMins === 0) return;

                if (trainStatus === 'delay') {
                    lineWidth = isCoarseTouch ? 3.5 : 2.5;
                    zIndex = 3;
                } else if (trainStatus === 'major-delay') {
                    lineWidth = isCoarseTouch ? 4.5 : 3.5;
                    zIndex = 5;
                }

                if (searchVal !== "") {
                    if (String(train.No) === searchVal) {
                        opacity = 1;
                        lineWidth = isCoarseTouch ? 6 : 5;
                        zIndex = 10;
                        shadowBlur = isCoarseTouch ? 0 : 12; // 觸控裝置停用高昂 shadowBlur
                        shadowColor = trainStatus === 'major-delay' ? THEME.danger : baseColor;
                    } else {
                        opacity = 0.12;
                        lineWidth = isCoarseTouch ? 1.5 : 1;
                        zIndex = 0;
                        shadowBlur = 0;
                    }
                }

                pathSegments.forEach((segment, segmentIndex) => {
                    const segmentStops = segment.stops;
                    const isSuspendedSegment = segment.susp === 1;
                    
                    let pathDataScheduled = [];
                    let pathDataActual = [];

                    segmentStops.forEach(stop => {
                        if (stop.Arr && stop.ArrTimeVal !== null) {
                            pathDataScheduled.push([stop.ArrTimeVal, stop.Name]);
                            pathDataActual.push([stop.ArrTimeVal + delayMins * 60000, stop.Name]);
                        }
                        if (stop.Dep && stop.Dep !== stop.Arr && stop.DepTimeVal !== null) {
                            pathDataScheduled.push([stop.DepTimeVal, stop.Name]);
                            pathDataActual.push([stop.DepTimeVal + delayMins * 60000, stop.Name]);
                        }
                    });

                    const activePathData = (isToday && isDelayed) ? pathDataActual : pathDataScheduled;

                    if (isToday && isDelayed) {
                        const nowTime = Date.now();
                        const pastStops = [];
                        const futureStops = [];

                        activePathData.forEach(pt => {
                            if (pt[0] <= nowTime) pastStops.push(pt);
                            else futureStops.push(pt);
                        });

                        if (pastStops.length > 0 && futureStops.length > 0) {
                            futureStops.unshift(pastStops[pastStops.length - 1]);
                        }

                        if (String(train.No) === searchVal) {
                            const shortType = getShortTrainType(train.Type, train.No);
                            seriesData.push({
                                name: `${shortType} ${train.No}次 (表訂)`,
                                type: 'line',
                                triggerLineEvent: false,
                                data: pathDataScheduled,
                                symbol: 'none',
                                z: zIndex - 1,
                                lineStyle: { color: THEME.textSecondary, width: 1.5, type: 'solid', opacity: 0.4 },
                                itemStyle: { color: THEME.textSecondary },
                                tooltip: { show: false }
                            });
                        }

                        if (pastStops.length > 1) {
                            const shortType = getShortTrainType(train.Type, train.No);
                            const finalColor = isSuspendedSegment ? '#444444' : baseColor;
                            const finalWidth = isSuspendedSegment ? 1.5 : lineWidth;
                            const finalType = isSuspendedSegment ? 'dashed' : 'solid';
                            const finalOpacity = isSuspendedSegment ? 0.4 : opacity;
                            
                            seriesData.push({
                                name: `${shortType} ${train.No}次 (已行駛)${pathSegments.length > 1 ? ` - 段${segmentIndex+1}` : ''}`,
                                type: 'line',
                                triggerLineEvent: true,
                                data: pastStops,
                                symbol: isSuspendedSegment ? 'rect' : 'circle',
                                symbolSize: searchVal === String(train.No) ? 8 : (isSuspendedSegment ? 4 : (isCoarseTouch ? 6 : 5)), 
                                z: zIndex,
                                lineStyle: { color: finalColor, width: finalWidth, type: finalType, opacity: finalOpacity, shadowBlur, shadowColor },
                                itemStyle: { color: finalColor },
                                tooltip: { formatter: createTooltipFormatter(train, delayMins, isSuspendedSegment, finalColor, ' (已行駛)', '🟢 已行駛') }
                            });
                        }

                        if (futureStops.length > 1) {
                            const shortType = getShortTrainType(train.Type, train.No);
                            const finalColor = isSuspendedSegment ? '#444444' : (delayMins > 0 ? THEME.danger : baseColor);
                            const finalWidth = isSuspendedSegment ? 1.5 : (delayMins > 0 ? (isCoarseTouch ? 3.5 : 2.5) : lineWidth);
                            const finalType = isSuspendedSegment ? 'dashed' : 'solid';
                            const finalOpacity = isSuspendedSegment ? 0.4 : opacity;

                            seriesData.push({
                                name: `${shortType} ${train.No}次 (未行駛)${pathSegments.length > 1 ? ` - 段${segmentIndex+1}` : ''}`,
                                type: 'line',
                                triggerLineEvent: true,
                                data: futureStops,
                                symbol: isSuspendedSegment ? 'rect' : 'circle',
                                symbolSize: searchVal === String(train.No) ? 8 : (isSuspendedSegment ? 4 : (isCoarseTouch ? 6 : 5)), 
                                z: zIndex + 1,
                                lineStyle: { color: finalColor, width: finalWidth, type: finalType, opacity: finalOpacity, shadowBlur, shadowColor },
                                itemStyle: { color: finalColor },
                                tooltip: { formatter: createTooltipFormatter(train, delayMins, isSuspendedSegment, finalColor, ' (預估)', delayMins > 0 ? `🔴 預估延誤 ${delayMins} 分` : '🟢 預估準點') }
                            });
                        }
                    } else {
                        const shortType = getShortTrainType(train.Type, train.No);
                        const finalColor = isSuspendedSegment ? '#444444' : baseColor;
                        const finalWidth = isSuspendedSegment ? 1.5 : lineWidth;
                        const finalType = isSuspendedSegment ? 'dashed' : 'solid';
                        const finalOpacity = isSuspendedSegment ? 0.4 : opacity;

                        seriesData.push({
                            name: `${shortType} ${train.No}次${pathSegments.length > 1 ? ` - 段${segmentIndex+1}` : ''}`,
                            type: 'line',
                            triggerLineEvent: true,
                            data: activePathData,
                            symbol: isSuspendedSegment ? 'rect' : 'circle',
                            symbolSize: searchVal === String(train.No) ? 8 : (isSuspendedSegment ? 4 : (isCoarseTouch ? 6 : 5)), 
                            z: zIndex,
                            lineStyle: { color: finalColor, width: finalWidth, type: finalType, opacity: finalOpacity, shadowBlur, shadowColor },
                            itemStyle: { color: finalColor },
                            tooltip: { formatter: createTooltipFormatter(train, delayMins, isSuspendedSegment, finalColor, '', '⚪ 表訂行程') }
                        });
                    }
                });
            });

            yAxisData = [...activeStations].reverse();
            
            // 營運通阻 MarkArea 區域渲染 (全以 escapeHtml 防禦)
            if (globalAlerts && globalAlerts.length > 0) {
                let markAreaAreas = [];
                globalAlerts.forEach(alert => {
                    const desc = String(alert.Description || "");
                    if (desc.includes("恢復行駛") || desc.includes("恢復通車") || desc.includes("已正常通車") || desc.includes("雙線通車")) return;
                    
                    const segmentRegex = /([\u4e00-\u9fff]+)\s*(?:至|＝|=|與|⇄)\s*([\u4e00-\u9fff]+)\s*間/g;
                    let segmentMatch;
                    while ((segmentMatch = segmentRegex.exec(desc)) !== null) {
                        let start = segmentMatch[1].replace(/站$/g, "").trim();
                        let end = segmentMatch[2].replace(/站$/g, "").trim();
                        if (desc.includes("不通") || desc.includes("中斷") || desc.includes("停駛") || desc.includes("坍方") || desc.includes("封閉")) {
                            if (yAxisData.includes(start) && yAxisData.includes(end)) {
                                markAreaAreas.push([
                                    { yAxis: start, name: '❌ ' + escapeHtml(alert.Title || '路線封鎖') },
                                    { yAxis: end }
                                ]);
                            }
                        }
                    }
                });

                if (markAreaAreas.length > 0) {
                    seriesData.push({
                        name: '通阻封鎖區間',
                        type: 'line',
                        markArea: {
                            itemStyle: { color: 'rgba(255, 71, 87, 0.15)' },
                            label: { position: 'inside', color: THEME.danger, fontWeight: 'bold', fontSize: 16 },
                            data: markAreaAreas
                        }
                    });
                }
            }

            const baseTime = new Date(`${dateStr}T00:00:00+08:00`).getTime();
            let viewMin = baseTime;
            let viewMax = baseTime + 25 * 3600 * 1000;

            if (isToday) {
                const now = new Date();
                const nowStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                seriesData.push({
                    name: '現在時間',
                    id: 'current-time-line',
                    type: 'line',
                    data: [],
                    tooltip: { formatter: `現在時間 ${nowStr}` },
                    markLine: {
                        symbol: ['none', 'none'],
                        tooltip: { formatter: `現在時間 ${nowStr}` },
                        label: {
                            show: true,
                            formatter: `現在時間 ${nowStr}`,
                            position: 'end',
                            color: THEME.danger,
                            fontSize: 12,
                            fontWeight: 'bold',
                            backgroundColor: 'rgba(20, 20, 26, 0.95)',
                            borderColor: 'rgba(255, 255, 255, 0.1)',
                            borderWidth: 1,
                            padding: [6, 10],
                            borderRadius: 6
                        },
                        lineStyle: {
                            color: THEME.danger,
                            type: 'solid',
                            width: 2,
                            shadowColor: 'rgba(255, 71, 87, 0.5)',
                            shadowBlur: 10
                        },
                        data: [{ xAxis: Date.now() }]
                    }
                });
            }

            const option = {
                backgroundColor: THEME.bgMain,
                animation: false, 
                tooltip: { 
                    trigger: 'item',
                    triggerOn: window.innerWidth <= 768 ? 'click' : 'mousemove|click',
                    backgroundColor: 'rgba(26, 26, 32, 0.95)',
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    textStyle: { color: THEME.textMain, fontFamily: 'inherit' }
                },
                dataZoom: [
                    { id: 'x-inside', type: 'inside', xAxisIndex: 0, filterMode: 'none', startValue: viewMin, endValue: viewMax }, 
                    { id: 'y-inside', type: 'inside', yAxisIndex: 0, filterMode: 'none' }, 
                    { id: 'x-slider', type: 'slider', xAxisIndex: 0, top: 15, height: 20, borderColor: '#26262b', textStyle: { color: '#fff' } },
                    { id: 'y-slider', type: 'slider', yAxisIndex: 0, filterMode: 'none', right: 15, width: 20, borderColor: '#26262b', textStyle: { color: '#fff' } }
                ],
                grid: { top: 60, right: 55, bottom: 80, left: 80 },
                xAxis: {
                    type: 'time',
                    min: baseTime,
                    max: viewMax,
                    position: 'top',
                    interval: 5 * 60 * 1000,
                    splitLine: { show: true, lineStyle: { color: 'rgba(255, 255, 255, 0.15)' } }, 
                    axisLabel: { formatter: '{HH}:{mm}', color: THEME.textSecondary, hideOverlap: true }
                },
                yAxis: {
                    type: 'category',
                    data: yAxisData,
                    splitLine: { show: true, lineStyle: { color: 'rgba(255, 255, 255, 0.15)' } },
                    axisLabel: { color: THEME.textMain, fontSize: 13, fontWeight: 'bold', interval: 0 }
                },
                series: seriesData
            };

            myChart.setOption(option, true);
        };

        const closeSidePanel = () => {
            if (els.sidePanel) els.sidePanel.classList.remove('active');
            if (els.searchInput) els.searchInput.value = '';
            renderChart(els.datePicker.value);
        };

        const showTrainDetails = (trainNo) => {
            const train = globalTimetable.find(t => String(t.No) === String(trainNo));
            if (!train) return;

            const trainColor = getTrainColor(train.Type, train.No);
            const shortType = getShortTrainType(train.Type, train.No);
            
            // XSS 安全轉義注入
            els.spTitle.innerHTML = `<span style="color:${escapeHtml(trainColor)}; font-family:'Outfit'; font-weight:800; font-size:24px;">${escapeHtml(train.No)}</span> <span style="font-size:18px;">${escapeHtml(shortType)}</span>`;
            els.spRoute.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${escapeHtml(train.StartStation || train.Start)} ➝ ${escapeHtml(train.EndStation || train.Dest)}`;

            const status = getTrainStatus(train);
            let badgeHtml = '';
            if (status === 'suspended') badgeHtml = '<span style="background:rgba(255,255,255,0.1); color:#fff; padding:4px 8px; border-radius:6px; font-size:12px;">停駛</span>';
            else if (status === 'on-time') badgeHtml = '<span style="background:rgba(46,213,115,0.15); color:var(--success); padding:4px 8px; border-radius:6px; font-size:12px;">準點</span>';
            else badgeHtml = `<span style="background:rgba(255,71,87,0.15); color:var(--danger); padding:4px 8px; border-radius:6px; font-size:12px;">延誤 +${globalLiveMap[train.No]?.DelayTime || 0}分</span>`;
            if (els.spStatusBadge) els.spStatusBadge.innerHTML = badgeHtml;

            const datePickerVal = els.datePicker.value;
            const nowTime = Date.now();
            let firstStopTimeMins = null;
            let pastCount = 0;
            const totalCount = train.Stops.length;
            let timelineHtml = '';

            const calculateDelayedTimeStr = (baseTimeStr, delayMins) => {
                if (!baseTimeStr) return '';
                const ms = parseTimeToTimestamp(baseTimeStr, datePickerVal, firstStopTimeMins) + delayMins * 60000;
                const d = new Date(ms);
                return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            };

            train.Stops.forEach((stop, index) => {
                const arrStr = stop.Arr;
                const depStr = stop.Dep;
                const timeStrForCalc = depStr || arrStr;
                if (!timeStrForCalc) return;
                
                let displayTimeHtml = '';
                if (index === 0) {
                    displayTimeHtml = escapeHtml(depStr);
                } else if (index === train.Stops.length - 1) {
                    displayTimeHtml = escapeHtml(arrStr);
                } else if (arrStr === depStr) {
                    displayTimeHtml = escapeHtml(arrStr);
                } else {
                    displayTimeHtml = `${escapeHtml(arrStr)}<br><span style="opacity: 0.5;">${escapeHtml(depStr)}</span>`;
                }

                const [h, m] = timeStrForCalc.split(':').map(Number);
                if (index === 0) firstStopTimeMins = h * 60 + m; 
                const timeVal = parseTimeToTimestamp(timeStrForCalc, datePickerVal, firstStopTimeMins);
                
                let isPast = timeVal <= nowTime;
                if (isPast) pastCount++;
                
                const delayedClass = (status.includes('delay') && !isPast) ? 'is-delayed' : '';
                const pastClass = isPast ? 'is-past' : '';
                
                let actualTimeStr = displayTimeHtml;
                if (status.includes('delay') && !isPast) {
                    const delayMins = globalLiveMap[train.No]?.DelayTime || 0;
                    if (displayTimeHtml.includes('<br>')) {
                        const delayedArr = calculateDelayedTimeStr(arrStr, delayMins);
                        const delayedDep = calculateDelayedTimeStr(depStr, delayMins);
                        actualTimeStr = `<div style="font-size:11px; opacity:0.7; text-decoration:line-through;">${escapeHtml(arrStr)}<br>${escapeHtml(depStr)}</div><div style="margin-top:2px">${escapeHtml(delayedArr)}</div><div style="opacity: 0.5;">${escapeHtml(delayedDep)}</div>`;
                    } else {
                        const delayedTime = calculateDelayedTimeStr(displayTimeHtml, delayMins);
                        actualTimeStr = `<div style="font-size:11px; opacity:0.7; text-decoration:line-through;">${displayTimeHtml}</div><div style="margin-top:2px">${escapeHtml(delayedTime)}</div>`;
                    }
                }

                timelineHtml += `
                    <div class="timeline-item ${pastClass} ${delayedClass}">
                        <div class="tl-time">${actualTimeStr}</div>
                        <div style="position:relative; display:flex; flex-direction:column; align-items:center;">
                            <div class="tl-dot"></div>
                            <div class="tl-line"></div>
                        </div>
                        <div class="tl-content">
                            <strong>${escapeHtml(stop.Name)}</strong>
                        </div>
                    </div>
                `;
            });

            if (totalCount > 0) {
                const progressPercent = Math.round((pastCount / totalCount) * 100);
                if (els.spProgressText) els.spProgressText.innerText = `${pastCount} / ${totalCount} 站`;
                if (els.spProgressBar) els.spProgressBar.style.width = `${progressPercent}%`;
            }

            els.spBody.innerHTML = timelineHtml;
            els.sidePanel.classList.add('active');
        };

        const updateStatsDashboard = () => {
            if (!globalTimetable || globalTimetable.length === 0) return;
            
            let totalTrains = globalTimetable.length;
            let ontimeCount = 0;
            let delayCount = 0;
            let suspendedCount = 0;
            let totalDelayMins = 0;
            let maxDelayMins = 0;

            globalTimetable.forEach(train => {
                const live = globalLiveMap[train.No] || globalLiveMap[train.TrainInfo?.TrainNo];
                if (live && live.SuspendedFlag) {
                    suspendedCount++;
                } else if (live && live.DelayTime > 0) {
                    delayCount++;
                    totalDelayMins += live.DelayTime;
                    if (live.DelayTime > maxDelayMins) maxDelayMins = live.DelayTime;
                } else {
                    ontimeCount++;
                }
            });

            const ontimePct = totalTrains ? Math.round((ontimeCount / totalTrains) * 100) : 0;
            const delayPct = totalTrains ? Math.round((delayCount / totalTrains) * 100) : 0;
            const suspendedPct = totalTrains ? Math.round((suspendedCount / totalTrains) * 100) : 0;

            if (els.statTotal) els.statTotal.innerText = totalTrains;
            if (els.statNormal) els.statNormal.innerText = ontimeCount;
            if (els.statNormalRate) els.statNormalRate.innerText = `${ontimePct}%`;
            if (els.statDelay) els.statDelay.innerText = delayCount;
            if (els.statDelayRate) els.statDelayRate.innerText = `${delayPct}%`;
            if (els.statSuspended) els.statSuspended.innerText = suspendedCount;
            if (els.statSuspendedRate) els.statSuspendedRate.innerText = `${suspendedPct}%`;
        };

        const showAlertsModal = () => {
            if (!els.alertsModalOverlay) return;
            els.alertsModalOverlay.style.display = 'flex';
            setTimeout(() => {
                els.alertsModalOverlay.style.opacity = '1';
                if (els.alertsModalBox) els.alertsModalBox.style.transform = 'scale(1)';
            }, 10);
        };

        const closeAlertsModal = () => {
            if (!els.alertsModalOverlay) return;
            els.alertsModalOverlay.style.opacity = '0';
            if (els.alertsModalBox) els.alertsModalBox.style.transform = 'scale(0.95)';
            setTimeout(() => {
                els.alertsModalOverlay.style.display = 'none';
            }, 300);
        };

        const quickJump = (stationName) => {
            if (!globalTimetable || globalTimetable.length === 0) return;
            const index = yAxisData.findIndex(s => s === stationName);
            if (index !== -1) {
                const range = 8;
                let startValue = Math.max(0, index - range);
                let endValue = Math.min(yAxisData.length - 1, index + range);
                myChart.dispatchAction({ type: 'dataZoom', dataZoomId: 'y-inside', startValue: startValue, endValue: endValue });
                myChart.dispatchAction({ type: 'dataZoom', dataZoomId: 'y-slider', startValue: startValue, endValue: endValue });
            }
        };

        const updateAlertsMarquee = (alerts) => {
            if (!alerts || alerts.length === 0) {
                if (els.alertBar) els.alertBar.style.display = 'none';
                return;
            }
            
            const isAlertNormal = (a) => a.Title.includes('正常') || a.Title.includes('恢復');
            const abnormalAlerts = alerts.filter(a => !isAlertNormal(a));
            const isAllNormal = abnormalAlerts.length === 0;
            
            if (els.alertBar) els.alertBar.style.display = 'flex';
            
            if (isAllNormal) {
                if (els.alertBar) {
                    els.alertBar.style.background = 'rgba(46, 213, 115, 0.08)';
                    els.alertBar.style.borderColor = 'rgba(46, 213, 115, 0.15)';
                }
                if (els.alertIconMain) els.alertIconMain.innerText = '✅';
                if (els.alertCount) {
                    els.alertCount.innerText = '全線正常';
                    els.alertCount.style.color = THEME.success;
                }
                if (els.alertsMarqueeText) els.alertsMarqueeText.innerHTML = '目前無重大營運通阻。';
            } else {
                if (els.alertBar) {
                    els.alertBar.style.background = 'rgba(255, 71, 87, 0.08)';
                    els.alertBar.style.borderColor = 'rgba(255, 71, 87, 0.15)';
                }
                if (els.alertIconMain) els.alertIconMain.innerText = '⚠️';
                if (els.alertCount) {
                    els.alertCount.innerText = `${abnormalAlerts.length} 項異常`;
                    els.alertCount.style.color = THEME.danger;
                }
                
                const firstAlert = abnormalAlerts[0];
                if (els.alertsMarqueeText) {
                    els.alertsMarqueeText.innerHTML = `<span style="color:${THEME.danger}">[${escapeHtml(firstAlert.Title)}]</span> ${escapeHtml(firstAlert.Description)}`;
                    // 動態計算跑馬燈速度
                    const textLen = (firstAlert.Title + firstAlert.Description).length;
                    const duration = Math.max(12, Math.round(textLen * 0.35));
                    els.alertsMarqueeText.style.animationDuration = `${duration}s`;
                }
            }
            
            // XSS 安全 Modal 渲染
            if (els.alertsModalBody) {
                els.alertsModalBody.innerHTML = alerts.map(a => {
                    const normal = isAlertNormal(a);
                    const color = normal ? THEME.success : THEME.danger;
                    return `
                    <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 8px; border-left: 3px solid ${color};">
                        <h4 style="margin: 0 0 8px 0; color: ${color};">${escapeHtml(a.Title)}</h4>
                        <p style="margin: 0; font-size: 14px; color: var(--text-secondary); line-height: 1.5;">${escapeHtml(a.Description)}</p>
                    </div>`;
                }).join('');
            }
        };

        const startAutoRefresh = () => {
            if (autoRefreshTimer) clearInterval(autoRefreshTimer);

            autoRefreshTimer = setInterval(async () => {
                if (els.datePicker && els.datePicker.value === getTwTodayString()) {
                    try {
                        if (els.loadingStatus) {
                            els.loadingStatus.classList.remove('success');
                            els.loadingStatus.style.opacity = '1';
                            els.loadingStatus.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                            els.loadingStatus.style.background = 'rgba(255, 165, 2, 0.1)';
                            els.loadingStatus.style.color = THEME.warning;
                            els.loadingStatus.innerHTML = `<i class="fas fa-sync fa-spin"></i> <span>更新即時位置中...</span>`;
                        }
                        
                        const [liveRes, alertsRes] = await Promise.all([
                            fetch(`${API_BASE}/api/live`),
                            fetch(`${API_BASE}/api/alerts`)
                        ]);
                        const liveData = await liveRes.json();
                        globalLiveMap = {};
                        liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                        updateLastUpdateTime();
                        
                        try {
                            globalAlerts = await alertsRes.json();
                            updateAlertsMarquee(globalAlerts);
                        } catch(e) {}
                        
                        renderChart(els.datePicker.value);
                        
                        if (els.loadingStatus) {
                            els.loadingStatus.classList.add('success');
                            els.loadingStatus.innerHTML = `<i class="fas fa-check"></i> 即時位置已更新`;
                            setTimeout(() => { els.loadingStatus.style.opacity = '0'; }, 3000);
                        }
                    } catch (e) {
                        console.error("每分鐘更新即時位置失敗:", e);
                        if (els.loadingStatus) {
                            els.loadingStatus.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                            els.loadingStatus.style.background = 'rgba(255, 71, 87, 0.1)';
                            els.loadingStatus.style.color = THEME.danger;
                            els.loadingStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> 位置更新失敗`;
                            setTimeout(() => { els.loadingStatus.style.opacity = '0'; }, 3000);
                        }
                    }
                }
            }, 60000);
        };

        const startTimers = () => {
            if (!clockInterval) clockInterval = setInterval(updateCurrentClock, 1000);
            if (!nowLineInterval) nowLineInterval = setInterval(updateNowLine, 10000);
        };

        const stopTimers = () => {
            if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
            if (nowLineInterval) { clearInterval(nowLineInterval); nowLineInterval = null; }
            if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
        };

        // 從 API 下載時刻表 (含 AbortController, Exponential Backoff, 歷史快取)
        const loadData = async (dateStr, retryCount = 0) => {
            // 取消舊的不當請求
            if (currentAbortController) {
                currentAbortController.abort();
            }
            currentAbortController = new AbortController();
            const signal = currentAbortController.signal;

            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }

            if (els.errorOverlay) els.errorOverlay.style.display = 'none';

            try {
                myChart.clear(); 
                if (els.loadingStatus) {
                    els.loadingStatus.classList.remove('success');
                    els.loadingStatus.style.opacity = '1';
                    els.loadingStatus.style.borderColor = 'rgba(255, 165, 2, 0.2)';
                    els.loadingStatus.style.background = 'rgba(255, 165, 2, 0.1)';
                    els.loadingStatus.style.color = THEME.warning;
                    els.loadingStatus.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span id="status-text">下載時刻表中...</span>`;
                }

                // 檢查記憶體快取 (非今天)
                let timetableData = null;
                const isToday = (dateStr === getTwTodayString());
                if (!isToday && timetableCache.has(dateStr)) {
                    timetableData = timetableCache.get(dateStr);
                } else {
                    const res = await fetch(`${API_BASE}/api/timetable/daily?date=${dateStr}`, { signal });
                    if (!res.ok) throw new Error("無該日時刻表資料");
                    timetableData = await res.json();
                    if (!isToday) {
                        timetableCache.set(dateStr, timetableData);
                    }
                }

                globalTimetable = timetableData;
                
                if (isToday) {
                    const statusTextEl = document.getElementById('status-text');
                    if (statusTextEl) statusTextEl.innerText = "抓取即時動態與通阻中...";
                    const [liveRes, alertsRes] = await Promise.all([
                        fetch(`${API_BASE}/api/live`, { signal }),
                        fetch(`${API_BASE}/api/alerts`, { signal })
                    ]);
                    const liveData = await liveRes.json();
                    globalLiveMap = {};
                    liveData.forEach(t => { globalLiveMap[t.TrainNo] = t; });
                    updateLastUpdateTime();
                    try {
                        globalAlerts = await alertsRes.json();
                        updateAlertsMarquee(globalAlerts);
                    } catch(e) {}
                } else {
                    globalLiveMap = {}; 
                    if (els.alertBar) els.alertBar.style.display = 'none';
                }

                // 清除 segment 快取，並對各車次進行結構化處理
                segmentsCache.clear();
                globalTimetable = globalTimetable.map(train => {
                    const expandedStops = [];
                    for (let i = 0; i < train.Stops.length; i++) {
                        expandedStops.push(train.Stops[i]);
                        if (i < train.Stops.length - 1) {
                            const stopA = train.Stops[i];
                            const stopB = train.Stops[i+1];
                            const nameA = stopA.Name.replace("-環島", "");
                            const nameB = stopB.Name.replace("-環島", "");
                            
                            const junctions = findJunctionsBetween(nameA, nameB);
                            if (junctions.length > 0) {
                                const virtualStops = interpolateJunctionStops(stopA, stopB, junctions);
                                expandedStops.push(...virtualStops);
                            }
                        }
                    }
                    
                    let firstStopTimeMins = null;
                    if (expandedStops.length > 0) {
                        const firstTimeStr = expandedStops[0].Dep || expandedStops[0].Arr;
                        if (firstTimeStr) {
                            const [h, m] = firstTimeStr.split(':').map(Number);
                            firstStopTimeMins = h * 60 + m;
                        }
                    }
                    
                    expandedStops.forEach(stop => {
                        stop.ArrTimeVal = stop.Arr ? parseTimeToTimestamp(stop.Arr, dateStr, firstStopTimeMins) : null;
                        stop.DepTimeVal = stop.Dep ? parseTimeToTimestamp(stop.Dep, dateStr, firstStopTimeMins) : null;
                    });
                    
                    return { ...train, Stops: expandedStops };
                });

                const statusTextEl = document.getElementById('status-text');
                if (statusTextEl) statusTextEl.innerText = "渲染圖表中...";
                renderChart(dateStr);
                
                if (els.loadingStatus) {
                    els.loadingStatus.classList.add('success');
                    els.loadingStatus.innerHTML = `<i class="fas fa-check"></i> 載入完成 (共 ${globalTimetable.length} 班次)`;
                }
                
                if (isToday) {
                    startAutoRefresh();
                }

                setTimeout(() => { 
                    if (els.loadingStatus) {
                        els.loadingStatus.style.opacity = '0'; 
                        els.loadingStatus.style.transition = 'opacity 1s'; 
                    }
                }, 3000);

            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log('連點切換已中斷先前載入請求');
                    return;
                }
                console.error(err);
                
                // Exponential Backoff 重試 (最高 2 次)
                if (retryCount < 2) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    console.log(`即將在 ${delay}ms 後重試載入...`);
                    setTimeout(() => loadData(dateStr, retryCount + 1), delay);
                    return;
                }

                globalTimetable = [];
                if (els.loadingStatus) {
                    els.loadingStatus.style.borderColor = 'rgba(255, 71, 87, 0.3)';
                    els.loadingStatus.style.background = 'rgba(255, 71, 87, 0.1)';
                    els.loadingStatus.style.color = THEME.danger;
                    els.loadingStatus.innerHTML = `<i class="fas fa-times"></i> 載入失敗: ${escapeHtml(err.message)}`;
                }
                
                if (els.errorOverlay && els.errorMsg) {
                    els.errorMsg.textContent = err.message || '未知錯誤';
                    els.errorOverlay.style.display = 'flex';
                }
            }
        };

        // 縮放操作 (改用 dataZoomId 防禦與 nullish 補全)
        const handleZoom = (direction) => {
            const option = myChart.getOption();
            if (!option || !option.dataZoom) return;
            
            const dz = option.dataZoom.find(z => z.id === 'x-inside') || option.dataZoom[0];
            const currentMin = (dz.startValue !== undefined && !isNaN(dz.startValue)) ? dz.startValue : (option.xAxis[0].min ?? Date.now());
            const currentMax = (dz.endValue !== undefined && !isNaN(dz.endValue)) ? dz.endValue : (option.xAxis[0].max ?? Date.now() + 86400000);
            const range = currentMax - currentMin;
            
            let newMin, newMax;
            if (direction === 'in') {
                newMin = currentMin + range * 0.15;
                newMax = currentMax - range * 0.15;
            } else {
                newMin = currentMin - range * 0.15;
                newMax = currentMax + range * 0.15;
            }
            
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomId: 'x-inside',
                startValue: newMin,
                endValue: newMax
            });
        };

        const handleZoomY = (direction) => {
            const option = myChart.getOption();
            if (!option || !option.dataZoom) return;
            
            const dz = option.dataZoom.find(z => z.id === 'y-inside') || option.dataZoom[1];
            const totalCount = option.yAxis[0].data.length;
            
            let currentMin = (dz.startValue !== undefined && !isNaN(dz.startValue)) ? dz.startValue : 0;
            let currentMax = (dz.endValue !== undefined && !isNaN(dz.endValue)) ? dz.endValue : totalCount - 1;
            
            const range = currentMax - currentMin;
            if (range <= 2 && direction === 'in') return;
            
            let newMin, newMax;
            if (direction === 'in') {
                newMin = Math.round(currentMin + range * 0.1);
                newMax = Math.round(currentMax - range * 0.1);
            } else {
                newMin = Math.max(0, Math.round(currentMin - range * 0.1));
                newMax = Math.min(totalCount - 1, Math.round(currentMax + range * 0.1));
            }
            
            if (newMin >= newMax) {
                newMin = Math.max(0, newMax - 2);
            }
            
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomId: 'y-inside',
                startValue: newMin,
                endValue: newMax
            });
        };

        const jumpToNow = () => {
            if (!myChart) return;
            const now = Date.now();
            const twoHours = 2 * 3600 * 1000;
            const newMin = now - twoHours;
            const newMax = now + twoHours;

            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomId: 'x-inside',
                startValue: newMin,
                endValue: newMax
            });

            if (yAxisData && yAxisData.length > 0) {
                const mid = Math.floor(yAxisData.length / 2);
                const halfRange = 7;
                const yMin = Math.max(0, mid - halfRange);
                const yMax = Math.min(yAxisData.length - 1, mid + halfRange);
                myChart.dispatchAction({
                    type: 'dataZoom',
                    dataZoomId: 'y-inside',
                    startValue: yMin,
                    endValue: yMax
                });
            }
        };

        const resetZoom = () => {
            if (!myChart) return;
            myChart.dispatchAction({
                type: 'dataZoom',
                dataZoomId: 'x-inside',
                start: 0,
                end: 100
            });

            const option = myChart.getOption();
            if (option && option.yAxis && option.yAxis[0]) {
                const totalCount = option.yAxis[0].data.length;
                myChart.dispatchAction({
                    type: 'dataZoom',
                    dataZoomId: 'y-inside',
                    startValue: 0,
                    endValue: totalCount - 1
                });
            }
        };

        // 綁定事件監聽器 (取消 HTML 內聯 onclick 污染)
        document.addEventListener('DOMContentLoaded', () => {
            initEls();

            const todayStr = getTwTodayString();
            els.datePicker.value = todayStr;
            els.datePicker.min = todayStr;
            
            const todayDate = new Date(Date.now() + 8 * 3600000);
            const maxDate = new Date(todayDate);
            maxDate.setDate(todayDate.getDate() + 60);
            els.datePicker.max = maxDate.toISOString().split('T')[0];

            // 恢復 URL 狀態 (若有)
            restoreStateFromUrl();
            
            // 載入資料
            loadData(els.datePicker.value).then(() => {
                if (els.datePicker.value === todayStr) {
                    jumpToNow();
                }
            });
            startTimers();

            // 浮動縮放與定位按鈕綁定
            if (els.jumpNowBtn) els.jumpNowBtn.addEventListener('click', jumpToNow);
            if (els.zoomInBtn) els.zoomInBtn.addEventListener('click', () => handleZoom('in'));
            if (els.zoomOutBtn) els.zoomOutBtn.addEventListener('click', () => handleZoom('out'));
            if (els.zoomResetBtn) els.zoomResetBtn.addEventListener('click', resetZoom);

            // Side Panel (Bottom Sheet) 拖曳手勢關閉
            let touchStartY = 0;
            if (els.sidePanel) {
                els.sidePanel.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                els.sidePanel.addEventListener('touchend', (e) => {
                    const touchEndY = e.changedTouches[0].clientY;
                    if (touchEndY - touchStartY > 80) { // 向下滑動超過 80px 時自動關閉
                        closeSidePanel();
                    }
                }, { passive: true });
            }

            // 事件監聽綁定
            els.datePicker.addEventListener('change', (e) => {
                loadData(e.target.value);
            });

            els.lineSelect.addEventListener('change', () => {
                renderChart(els.datePicker.value);
            });

            const debouncedSearch = debounce((val) => {
                renderChart(els.datePicker.value);
                if (val) {
                    showTrainDetails(val);
                } else {
                    closeSidePanel();
                }
            }, 300);

            els.searchInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                debouncedSearch(val);
            });

            els.clearSearch.addEventListener('click', () => {
                els.searchInput.value = '';
                renderChart(els.datePicker.value);
                closeSidePanel();
            });

            els.typeFilter.addEventListener('change', () => {
                renderChart(els.datePicker.value);
            });

            els.delayToggleBtn.addEventListener('click', () => {
                els.delayOnlyCheckbox.checked = !els.delayOnlyCheckbox.checked;
                if (els.delayOnlyCheckbox.checked) {
                    els.delayToggleBtn.classList.add('active');
                } else {
                    els.delayToggleBtn.classList.remove('active');
                }
                renderChart(els.datePicker.value);
            });

            els.openAlerts.addEventListener('click', showAlertsModal);
            if (els.alertsModalClose) els.alertsModalClose.addEventListener('click', closeAlertsModal);
            if (els.spClose) els.spClose.addEventListener('click', closeSidePanel);
            if (els.retryBtn) els.retryBtn.addEventListener('click', () => loadData(els.datePicker.value));

            // ECharts 點擊事件
            myChart.on('click', function(params) {
                if (params.seriesName === '現在時間') return;
                const match = params.seriesName.match(/(\d+)次/);
                if (match && match[1]) {
                    const trainNo = match[1];
                    showTrainDetails(trainNo);
                    if (els.searchInput.value !== trainNo) {
                        els.searchInput.value = trainNo;
                        renderChart(els.datePicker.value);
                    }
                }
            });

            myChart.getZr().on('click', function(params) {
                if (!params.target) {
                    closeSidePanel();
                }
            });

            // ResizeObserver 替代舊 window.onresize（防範鍵盤彈出導致的圖表扭曲）
            if (window.ResizeObserver && els.echartsContainer) {
                const ro = new ResizeObserver(debounce(() => {
                    if (myChart) myChart.resize();
                }, 150));
                ro.observe(els.echartsContainer);
            } else {
                window.addEventListener('resize', debounce(() => {
                    if (myChart) myChart.resize();
                }, 150));
            }
        });

        // Esc 鍵與 Keyboard Accessibility
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (els.alertsModalOverlay && els.alertsModalOverlay.style.display !== 'none') {
                    closeAlertsModal();
                } else if (els.sidePanel && els.sidePanel.classList.contains('active')) {
                    closeSidePanel();
                }
            }
        });

        // Page Visibility API：背景分頁自動暫停與喚醒
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopTimers();
            } else {
                startTimers();
                updateCurrentClock();
                updateNowLine();
                if (els.datePicker && els.datePicker.value === getTwTodayString()) {
                    startAutoRefresh();
                }
            }
        });
    </script>
</body>
</html>
