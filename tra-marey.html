<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺鐵即時列車運行圖 (Marey Chart)</title>
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #0f0f12; color: #f1f2f6; 
            font-family: 'Outfit', 'Noto Sans TC', 'Segoe UI', sans-serif; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header { 
            padding: 12px 24px; 
            background: rgba(26, 26, 32, 0.95); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); 
            z-index: 10; position: relative;
        }
        .header-title-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            color: #a4b0be;
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            color: #fff;
            background: rgba(79, 172, 254, 0.2);
            border-color: #4facfe;
            transform: translateX(-2px);
        }
        h2 { 
            margin: 0; 
            font-size: 20px; 
            font-weight: 700;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 控制列樣式 */
        #toolbar {
            background: rgba(20, 20, 26, 0.8); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 24px;
            display: flex; gap: 24px; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9; position: relative;
            flex-wrap: wrap;
        }
        .toolbar-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar-item label {
            color: #a4b0be;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="date"], input[type="text"], select {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 40px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: #4facfe;
            background: rgba(25, 25, 30, 0.95);
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.25);
        }
        input[type="text"] { width: 190px; cursor: text; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        select { font-weight: 600; cursor: pointer; background-image: linear-gradient(135deg, rgba(79, 172, 254, 0.1) 0%, rgba(0, 242, 254, 0.05) 100%); }
        select optgroup { background: #1f1f26; color: #fff; }
        select option { background: #1f1f26; color: #fff; }

        /* 誤點過濾 Toggle Badge (提升視覺層次與觸控熱區) */
        .delay-toggle-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
            min-height: 40px;
            box-sizing: border-box;
        }
        .delay-toggle-badge:hover {
            background: rgba(255, 71, 87, 0.2);
            border-color: rgba(255, 71, 87, 0.6);
            transform: translateY(-1px);
        }
        .delay-toggle-badge.active {
            background: rgba(255, 71, 87, 0.9);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.5);
        }

        .status { 
            font-size: 14px; 
            font-weight: 500;
            color: #ffa502; 
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 165, 2, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 165, 2, 0.2);
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .status.success {
            color: #2ed573;
            background: rgba(46, 213, 115, 0.1);
            border-color: rgba(46, 213, 115, 0.2);
        }
        .status i {
            animation: spin 2s linear infinite;
        }
        .status.success i {
            animation: none;
        }
        .legend { font-size: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; justify-content: center; flex: 1; margin-left: 20px; }
        .legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: flex-end; }
        .legend span { display: flex; align-items: center; gap: 6px; color: #a4b0be; white-space: nowrap; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        
        #chart-wrapper { 
            position: relative; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            width: 100vw; 
        }
        #chart-container { 
            flex: 1;
            width: 100%; 
        }
        .zoom-btn {
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f1f2f6;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 38px;
            box-sizing: border-box;
        }
        .zoom-btn:hover {
            background: rgba(80, 71, 209, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(80, 71, 209, 0.3);
        }
        .zoom-btn:active {
            transform: translateY(1px);
        }

        /* 側邊面板樣式 */
        #side-panel {
            position: fixed;
            top: 61px; /* 在 header 下方 */
            right: -420px;
            width: 400px;
            height: calc(100vh - 61px);
            background: rgba(20, 20, 26, 0.95);
            backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: -5px 0 25px rgba(0,0,0,0.6);
            z-index: 20;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            color: #f1f2f6;
        }
        #side-panel.active {
            right: 0;
        }
        .sp-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sp-header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }
        .sp-header-info {
            flex: 1;
        }
        /* 側邊欄列車即時進度條 */
        .sp-progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            margin-top: 4px;
        }
        .sp-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            width: 0%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sp-progress-text {
            font-size: 0.78rem;
            color: #a4b0be;
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-weight: 500;
        }
        .sp-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .sp-route {
            font-size: 0.9rem;
            color: #a4b0be;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sp-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .sp-close:hover {
            background: rgba(255, 71, 87, 0.8);
            transform: scale(1.1) rotate(90deg);
        }
        .sp-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
        }
        .sp-body::-webkit-scrollbar { width: 6px; }
        .sp-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .sp-body::-webkit-scrollbar-track { background: transparent; }

        .timeline {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 58px; /* 對齊 node 中心 */
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: rgba(255, 255, 255, 0.15);
        }
        .timeline-item {
            display: flex;
            position: relative;
            margin-bottom: 24px;
            min-height: 40px;
        }
        .timeline-item:last-child {
            margin-bottom: 0;
        }
        .timeline-item.past {
            opacity: 0.35;
            filter: grayscale(100%);
        }
        .tl-time {
            width: 45px;
            text-align: right;
            padding-right: 15px;
            font-family: 'Outfit', monospace;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 1px;
        }
        .tl-time .expected {
            color: #a4b0be;
        }
        .tl-time .actual {
            color: #ff4757;
            font-weight: bold;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .tl-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2ed573;
            border: 3px solid #14141a;
            position: absolute;
            left: 49px;
            top: 4px;
            z-index: 2;
            box-shadow: 0 0 8px rgba(46, 213, 115, 0.4);
        }
        .timeline-item.past .tl-node {
            background: #a4b0be;
            box-shadow: none;
        }
        .timeline-item.delayed .tl-node {
            background: #ff4757;
            box-shadow: 0 0 8px rgba(255, 71, 87, 0.4);
        }
        .tl-content {
            padding-left: 25px;
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .station-name {
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 1px;
        }
        .delay-tag {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid rgba(255, 71, 87, 0.3);
            white-space: nowrap;
        }
        .ontime-tag {
            background: rgba(46, 213, 115, 0.1);
            color: #2ed573;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            border: 1px solid rgba(46, 213, 115, 0.2);
            white-space: nowrap;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* CSS Marquee 動畫 (取代 <marquee> 標籤) */
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .marquee-track {
            display: flex;
            overflow: hidden;
            flex: 1;
        }
        .marquee-content {
            display: inline-flex;
            white-space: nowrap;
            animation: marqueeScroll linear infinite;
            will-change: transform;
        }
        .marquee-content .marquee-copy {
            display: inline-flex;
            padding-right: 60px;
        }

        /* 錯誤重試覆蓋層 */
        .error-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(15, 15, 18, 0.92);
            backdrop-filter: blur(8px);
            z-index: 50;
        }
        .error-overlay i.fa-exclamation-triangle {
            font-size: 48px;
            color: #ff4757;
            filter: drop-shadow(0 0 20px rgba(255, 71, 87, 0.4));
        }
        .error-overlay .error-msg {
            font-size: 1.1rem;
            color: #ff4757;
            font-weight: 600;
        }
        .error-overlay .retry-btn {
            background: rgba(79, 172, 254, 0.15);
            border: 1px solid rgba(79, 172, 254, 0.4);
            color: #4facfe;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-overlay .retry-btn:hover {
            background: rgba(79, 172, 254, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        /* 手機版響應式設計 */
        @media (max-width: 768px) {
            #header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 12px 16px;
            }
            .header-title-container { width: 100%; }
            h2 { font-size: 16px; }
            .legend { display: none; } /* 手機版隱藏圖例節省空間 */
            
            #loading-status {
                align-self: flex-end;
                margin-top: -38px;
            }
            
            #toolbar {
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .toolbar-item {
                justify-content: space-between;
                width: 100%;
            }
            /* 防 iOS 觸發自動縮放 trap：字號設為 16px */
            input[type="date"], input[type="text"], select {
                font-size: 16px !important;
                min-height: 44px;
            }
            .delay-toggle-badge {
                min-height: 44px;
            }
                width: 60%;
                max-width: 250px;
            }
            
            #side-panel {
                width: 85%;
                max-width: 400px;
                right: -100%;
                top: 0;
                height: 100vh;
                z-index: 9999;
                box-shadow: -10px 0 40px rgba(0,0,0,0.8);
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <div class="header-title-container">
            <a href="index.html" class="back-btn" title="返回主頁"><i class="fas fa-arrow-left"></i></a>
            <h2>🚄 臺鐵列車運行圖 (即時動態版)</h2>
        </div>
        <div class="legend">
            <div class="legend-row">
                <span><div class="dot" style="background:#de3923;"></div>普悠瑪</span>
                <span><div class="dot" style="background:#e6a822;"></div>太魯閣</span>
                <span><div class="dot" style="background:#888888;"></div>新自強</span>
                <span><div class="dot" style="background:#eb7405;"></div>自強</span>
                <span><div class="dot" style="background:#9c612a;"></div>莒光</span>
                <span><div class="dot" style="background:#6ac242;"></div>區間快</span>
                <span><div class="dot" style="background:#48c5db;"></div>區間</span>
                <span><div class="dot" style="background:#5047d1;"></div>普快</span>
                <span><div class="dot" style="background:#a4b0be;"></div>其他</span>
            </div>
            <div class="legend-row">
                <span><div class="dot" style="background:#e0821d;"></div>鳴日號</span>
                <span><div class="dot" style="background:#7edece;"></div>海風號</span>
                <span><div class="dot" style="background:#d1f024;"></div>山嵐號</span>
                <span><div class="dot" style="background:#f774ba;"></div>環島之星</span>
                <span><div class="dot" style="background:#a3175d;"></div>專車</span>
                <span><div class="dot" style="background:#7db583;"></div>入伍專車</span>
                <span><div class="dot" style="background:#bdc3c7;"></div>蒸汽火車</span>
                <span><div style="border-bottom: 2px dashed #ff4757; width: 20px;"></div>預估軌跡</span>
                <span><div style="border-bottom: 2px dotted #444444; width: 20px;"></div>停駛</span>
            </div>
        </div>
        <div class="status" id="loading-status">
            <i class="fas fa-spinner"></i> <span id="status-text">準備載入資料...</span>
        </div>
    </div>

    <!-- 查詢控制列 -->
    <div id="toolbar">
        <div class="toolbar-item">
            <label for="line-select" style="color:#fff; font-weight: bold;"><i class="fas fa-route" style="color:#4facfe;"></i> 選擇線路：</label>
            <select id="line-select" style="border-color: rgba(79, 172, 254, 0.4); box-shadow: 0 0 10px rgba(79, 172, 254, 0.15);">
                <optgroup label="西部幹線">
                    <option value="west-north" selected>北段 (基隆 － 竹南)</option>
                    <option value="west-mountain">山線 (竹南 － 彰化)</option>
                    <option value="west-sea">海線 (竹南 － 彰化)</option>
                    <option value="west-south">南段 (彰化 － 高雄)</option>
                    <option value="pingtung">屏東線 (高雄 － 枋寮)</option>
                </optgroup>
                <optgroup label="東部幹線與南迴線">
                    <option value="yilan">宜蘭線 (八堵 － 蘇澳)</option>
                    <option value="north-link">北迴線 (蘇澳新 － 花蓮)</option>
                    <option value="taitung">台東線 (花蓮 － 台東)</option>
                    <option value="south-link">南迴線 (台東 － 枋寮)</option>
                </optgroup>
                <optgroup label="支線">
                    <option value="pingxi-shenao">平溪深澳線 (八斗子 － 菁桐)</option>
                    <option value="neiwan">內灣線 (新竹 － 內灣)</option>
                    <option value="liujia">六家線 (新竹 － 六家)</option>
                    <option value="jiji">集集線 (二水 － 車埕)</option>
                    <option value="shalun">沙崙線 (中洲 － 沙崙)</option>
                </optgroup>
            </select>
        </div>
        <div class="toolbar-item">
            <label for="date-picker"><i class="far fa-calendar-alt"></i> 選擇日期：</label>
            <input type="date" id="date-picker">
        </div>
        <div class="toolbar-item">
            <label for="train-search"><i class="fas fa-search"></i> 車次查詢：</label>
            <input type="text" id="train-search" placeholder="輸入車次 (例: 408)">
        </div>
        <div class="toolbar-item" style="margin-left: 10px;">
            <div id="delay-toggle-btn" class="delay-toggle-badge" onclick="toggleDelayOnlyFilter()">
                <input type="checkbox" id="delay-only-checkbox" style="display: none;">
                <i class="fas fa-filter"></i> 僅顯示誤點
            </div>
        </div>
    </div>

    <!-- 即時通阻 Marquee -->
    <div id="alerts-marquee" style="background: rgba(255, 71, 87, 0.15); border-bottom: 1px solid rgba(255, 71, 87, 0.3); color: #ff4757; padding: 10px 0; overflow: hidden; white-space: nowrap; font-size: 16px; display: none; align-items: center; z-index: 5; position: relative;">
        <div id="alerts-marquee-badge" style="padding: 0 16px; font-weight: bold; border-right: 1px solid rgba(255, 71, 87, 0.5); margin-right: 10px; display: flex; align-items: center; background: rgba(20,20,26,0.8); height: 100%;">⚠️ 營運通阻狀態</div>
        <div class="marquee-track"><div class="marquee-content" id="alerts-marquee-text"></div></div>
    </div>

    <!-- 運行圖包裹器 -->
    <div id="chart-wrapper">
        <!-- 頂部控制列 (獨立一列，避免擋住 ECharts 頂部的時間軸) -->
        <div class="chart-controls-bar" style="background: rgba(20, 20, 26, 0.5); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <span style="color: #a4b0be; font-size: 13px; font-weight: bold; margin-right: 4px;"><i class="fas fa-arrows-alt-v"></i> 車站間距:</span>
                <button class="zoom-btn" onclick="handleZoomY('in')" title="拉開車站軸 (放大)" style="position: static;"><i class="fas fa-arrows-alt-v"></i> 拉開</button>
                <button class="zoom-btn" onclick="handleZoomY('out')" title="壓縮車站軸 (縮小)" style="position: static;"><i class="fas fa-compress-alt"></i> 壓縮</button>
            </div>
