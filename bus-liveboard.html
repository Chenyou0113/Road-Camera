    function updateBusesMap(buses) {
        if(!map) return;
        
        mapMarkers.buses.forEach(m => m.remove());
        mapMarkers.buses = [];

        buses.forEach(bus => {
            if(!bus.lat || !bus.lon) return;
            const plate = bus.plate || bus.PlateNumb || '';

            const busEl = document.createElement('div');
            busEl.innerHTML = `
                <svg width="24" height="40" viewBox="-12 -22 24 40" style="display:block; overflow:visible;">
                    <path d="M -10,-14 L 10,-14 L 10,14 L -10,14 Z M 0,-20 L 8,-14 L -8,-14 Z" fill="#ef4444" stroke="white" stroke-width="2" />
                </svg>
            `;
            busEl.style.transform = `rotate(${bus.azi || 0}deg)`;
            busEl.style.transformOrigin = 'center center';
            busEl.style.cursor = 'pointer';

            const marker = new maplibregl.Marker({ element: busEl })
                .setLngLat([bus.lon, bus.lat])
                .addTo(map);

            busEl.addEventListener('click', () => {
                const cityRegistry = vehicleMap[`${currentData.type}_${currentData.city}`] || {};
                const vReg = cityRegistry[plate] || {};
                const year = vReg.year && vReg.year !== '不詳' ? `${vReg.year}年` : '年份未知';
                
                const vehicleClass = vReg.vehicleClass || 1;
                let busIcon = 'fa-bus';
                let classText = '巴士';
                if (vehicleClass === 6) {
                    busIcon = 'fa-taxi';
                    classText = '幸福小黃 (計程車)';
                } else if (vehicleClass === 3) {
                    classText = '小型巴士';
                } else if (vehicleClass === 2) {
                    classText = '中型巴士';
                } else if (vehicleClass === 4) {
                    classText = '雙層巴士';
                } else if (vehicleClass === 5) {
                    classText = '雙節巴士';
                } else if (vehicleClass === 1) {
                    classText = '大型巴士';
                }

                const isElectric = vReg.isElectric || plate.endsWith('FV') || /^E[A-Z]{2}-/.test(plate); 
                const isHybrid = vReg.isHybrid || false;
                const isLowFloor = vReg.isLowFloor || false;
                const hasLift = vReg.hasLift || vReg.isBarrierFreeTaxi || false;

                new maplibregl.Popup({ offset: 25 })
                    .setLngLat([bus.lon, bus.lat])
                    .setHTML(`
                        <div style="padding:10px; font-family:'Noto Sans TC',sans-serif;">
                            <div style="font-size:1.1rem; font-weight:900; color:#2563eb; display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                                <i class="fas ${busIcon}"></i> <span>${plate}</span>
                            </div>
                            <div style="font-size:0.9rem; color:#4b5563; line-height:1.4;">
                                <div>車輛類型：${classText}</div>
                                <div>出廠年份：${year}</div>
                                <div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; font-weight:bold;">
                                    ${isElectric ? '<span style="color:#3b82f6;"><i class="fas fa-bolt"></i> 電動車</span>' : ''}
                                    ${isHybrid ? '<span style="color:#10b981;"><i class="fas fa-leaf"></i> 油電混合</span>' : ''}
                                    ${isLowFloor || hasLift ? '<span style="color:#d97706;"><i class="fas fa-wheelchair"></i> 無障礙設備</span>' : ''}
                                </div>
                            </div>
                        </div>
                    `)
                    .addTo(map);
            });

            mapMarkers.buses.push(marker);
        });
    }

    function focusMap(lat, lng) {
        if (!map) return;
        map.flyTo({ center: [lng, lat], zoom: 17 });
    }

    let userLocationMarker = null;

    function locateMe() {
        if (!navigator.geolocation) {
            alert("您的瀏覽器不支援地理定位功能。");
            return;
        }

        const btn = document.getElementById('locate-btn');
        btn.classList.add('locating');

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                btn.classList.remove('locating');

                if (!map) return;
                
                map.flyTo({ center: [lng, lat], zoom: 16 });

                if (userLocationMarker) {
                    userLocationMarker.setLngLat([lng, lat]);
                } else {
                    const dot = document.createElement('div');
                    dot.style.width = '16px';
                    dot.style.height = '16px';
                    dot.style.backgroundColor = '#3b82f6';
                    dot.style.border = '3px solid white';
                    dot.style.borderRadius = '50%';
                    dot.style.boxShadow = '0 0 10px rgba(59, 130, 246, 0.5)';
                    
                    userLocationMarker = new maplibregl.Marker({ element: dot })
                        .setLngLat([lng, lat])
                        .addTo(map);
                }

                if (currentData.route && currentData.stops[currentData.direction]) {
                    let minDistance = Infinity;
                    let nearestStopId = null;

                    currentData.stops[currentData.direction].forEach(s => {
                        if(s.StopPosition) {
                            const d = getDistance(lat, lng, s.StopPosition.PositionLat, s.StopPosition.PositionLon);
                            if (d < minDistance) {
                                minDistance = d;
                                nearestStopId = s.StopUID;
                            }
                        }
                    });

                    if (nearestStopId) {
                        const stopEl = document.getElementById(`stop-${nearestStopId}`);
                        if (stopEl) {
                            stopEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            stopEl.style.backgroundColor = '#ecfdf5';
                            setTimeout(() => stopEl.style.backgroundColor = '', 2000);
                        }
                    }
                }
            },
            () => {
                btn.classList.remove('locating');
                alert("無法獲取您的位置，請確認是否開啟定位權限。");
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    }

    async function handleSearchPlate(plate) {
        if (!plate || plate === '---') return false;
        let bus = lastBuses.find(b => (b.PlateNumb === plate || b.plate === plate));
        if (bus && bus.lat) {
            focusMap(bus.lat, bus.lon);
            return true;
        }
        alert(`找不到車牌 ${plate} 的即時位置。`);
        return false;
    }

    function decodeHtmlEntities(str) {
        if (!str) return "";
        const txt = document.createElement("textarea");
        txt.innerHTML = str;
        return txt.value;
    }

    async function openCityNewsModal(targetCity = null) {
        currentModalSession++; // 🌟 發行新的彈窗身分證
        const session = currentModalSession;

        const modal = document.getElementById('modal-overlay');
        const title = document.getElementById('modal-title');
        const body = document.getElementById('modal-body');
        
        const city = targetCity || browser.city || 'Taipei';
        
        let type = 'CityBus';
        const drtsCities = ['DRTS_Taipei', 'DRTS_NewTaipei', 'DRTS_Taichung', 'DRTS_Tainan', 'DRTS_HualienCounty'];
        if (city === 'InterCity') {
            type = 'InterCity';
        } else if (city === 'HSP' || city === 'CTSP') {
            type = 'SciencePark';
        } else if (drtsCities.includes(city)) {
            type = 'DRTS';
        } else if (targetCity === null) {
            type = currentData.type || browser.type || 'CityBus';
        }

        const cityNameMap = {
            'Taipei': '臺北市', 'NewTaipei': '新北市', 'Keelung': '基隆市',
            'Taoyuan': '桃園市', 'Hsinchu': '新竹市', 'HsinchuCounty': '新竹縣',
            'YilanCounty': '宜蘭縣', 'MiaoliCounty': '苗栗縣', 'Taichung': '臺中市',
            'ChanghuaCounty': '彰化縣', 'NantouCounty': '南投縣', 'YunlinCounty': '雲林縣',
            'Chiayi': '嘉義市', 'ChiayiCounty': '嘉義縣', 'Tainan': '臺南市',
            'Kaohsiung': '高雄市', 'PingtungCounty': '屏東縣',
            'HualienCounty': '花蓮縣', 'TaitungCounty': '臺東縣',
            'PenghuCounty': '澎湖縣', 'KinmenCounty': '金門縣', 'LienchiangCounty': '連江縣',
            'InterCity': '公路客運',
            'HSP': '新竹科學園區接駁車',
            'CTSP': '中部科學園區接駁車',
            'DRTS_Taipei': '臺北市 (需求反應式公車)',
            'DRTS_NewTaipei': '新北市 (需求反應式公車)',
            'DRTS_Taichung': '臺中市 (需求反應式公車)',
            'DRTS_Tainan': '臺南市 (需求反應式公車)',
            'DRTS_HualienCounty': '花蓮縣 (需求反應式公車)'
        };

        title.innerHTML = `<i class="fas fa-bullhorn"></i> <span>營運公告</span>`;

        let selectHtml = `
            <div style="margin-bottom: 20px; padding: 12px; background: #f1f5f9; border-radius: 12px; border: 1px solid #e2e8f0;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                    <i class="fas fa-filter" style="color:#64748b;"></i>
                    <span style="font-weight:700; color:#475569; font-size:0.9rem;">切換公告縣市/類型</span>
                </div>
                <select id="news-city-select" onchange="openCityNewsModal(this.value)" style="width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:1rem; outline:none; background:white; font-weight:600; color:#334155; cursor:pointer;">
        `;
        
        selectHtml += `<optgroup label="全台路網">`;
        const isInterSelected = (city === 'InterCity') ? 'selected' : '';
        selectHtml += `<option value="InterCity" ${isInterSelected}>公路客運</option>`;
        selectHtml += `</optgroup>`;

        selectHtml += `<optgroup label="需求反應式公車 (DRTS)">`;
        const isDrtsTaipeiSelected = (city === 'DRTS_Taipei') ? 'selected' : '';
        const isDrtsNewTaipeiSelected = (city === 'DRTS_NewTaipei') ? 'selected' : '';
        const isDrtsTaichungSelected = (city === 'DRTS_Taichung') ? 'selected' : '';
        const isDrtsTainanSelected = (city === 'DRTS_Tainan') ? 'selected' : '';
        const isDrtsHualienSelected = (city === 'DRTS_HualienCounty') ? 'selected' : '';
        selectHtml += `<option value="DRTS_Taipei" ${isDrtsTaipeiSelected}>臺北市 (預約公車)</option>`;
        selectHtml += `<option value="DRTS_NewTaipei" ${isDrtsNewTaipeiSelected}>新北市 (預約公車)</option>`;
        selectHtml += `<option value="DRTS_Taichung" ${isDrtsTaichungSelected}>臺中市 (預約公車)</option>`;
        selectHtml += `<option value="DRTS_Tainan" ${isDrtsTainanSelected}>臺南市 (預約公車)</option>`;
        selectHtml += `<option value="DRTS_HualienCounty" ${isDrtsHualienSelected}>花蓮縣 (預約公車)</option>`;
        selectHtml += `</optgroup>`;

        selectHtml += `<optgroup label="科學園區">`;
        const isHspSelected = (city === 'HSP') ? 'selected' : '';
        const isCtspSelected = (city === 'CTSP') ? 'selected' : '';
        selectHtml += `<option value="HSP" ${isHspSelected}>新竹科學園區接駁車</option>`;
        selectHtml += `<option value="CTSP" ${isCtspSelected}>中部科學園區接駁車</option>`;
        selectHtml += `</optgroup>`;

        selectHtml += `<optgroup label="市區公車">`;
        for (const [code, name] of Object.entries(cityNameMap)) {
            if (code === 'InterCity' || code === 'HSP' || code === 'CTSP' || drtsCities.includes(code)) continue;
            const isSelected = (code === city) ? 'selected' : '';
            selectHtml += `<option value="${code}" ${isSelected}>${name}</option>`;
        }
        selectHtml += `</optgroup></select></div>`;

        body.innerHTML = `
            ${selectHtml}
            <div id="news-content-area">
                <div style="text-align:center; padding:40px;">
                    <i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary)"></i><br><br>正在載入 ${cityNameMap[city] || city} 公告...
                </div>
            </div>
        `;
        modal.style.display = 'flex';

        const actualCity = city.replace('DRTS_', '');

        try {
            const [newsRes, alertRes] = await Promise.all([
                throttledFetch(`${WORKER_URL}/?action=news&category=${type}&city=${actualCity}`).then(r => r.json()),
                throttledFetch(`${WORKER_URL}/?action=alert&category=${type}&city=${actualCity}`).then(r => r.json())
            ]);

            if (currentModalSession !== session) return; // 🌟 核心防護斷

            const allItems = [
                ...(Array.isArray(alertRes) ? alertRes : []).map(a => ({ 
                    title: a.Title, 
                    desc: a.Description, 
                    date: a.StartTime || a.PublishTime, 
                    tag: '通阻', 
                    cls: 'tag-alert',
                    status: a.Status,
                    cause: a.Cause,
                    effect: a.Effect,
                    scope: a.Scope
                })),
                ...(Array.isArray(newsRes) ? newsRes : []).map(n => ({ 
                    title: n.Title, 
                    desc: n.Description, 
                    date: n.PublishTime, 
                    tag: '消息', 
                    cls: 'tag-news',
                    category: n.NewsCategory,
                    phone: n.ContactPhone,
                    newsUrl: n.NewsURL,
                    attachmentUrl: n.AttachmentURL
                }))
            ].sort((a, b) => new Date(b.date) - new Date(a.date));

            const contentArea = document.getElementById('news-content-area');

            if (!allItems.length) {
                contentArea.innerHTML = `<div style="text-align:center; color:#9ca3af; padding:40px;">無公告</div>`;
                return;
            }

            const causeMap = {
                1: "事故", 2: "維護檢修", 3: "技術問題", 4: "施工", 5: "醫療緊急狀況",
                6: "氣候", 7: "示威遊行", 8: "政治活動", 9: "假日/節慶",
                10: "罷工", 11: "活動", 12: "未達發車門檻", 254: "其他原因", 255: "未知原因"
            };
            const effectMap = {
                1: "改道/不停靠", 2: "班次增加", 3: "班次減少", 4: "停止服務",
                5: "班次變更", 6: "站點異動", 7: "重大延遲", 254: "其他影響", 255: "未知影響"
            };

            contentArea.innerHTML = '<div style="display:flex; flex-direction:column; gap:16px;">' + 
                allItems.map(i => {
                    let descHtml = decodeHtmlEntities(i.desc);
                    descHtml = descHtml.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
                    if (!/<[a-z][\s\S]*>/i.test(descHtml)) {
                        descHtml = descHtml.replace(/\n/g, '<br>');
                    }

                    // 營運狀況狀態標籤
                    let statusHtml = '';
                    if (i.tag === '通阻' && i.status !== undefined) {
                        if (i.status === 0) statusHtml = `<span style="background:#fef2f2; color:#ef4444; border:1px solid #fee2e2; font-size:0.75rem; font-weight:800; padding:2px 6px; border-radius:4px; margin-right:6px;"><i class="fas fa-exclamation-triangle"></i> 營運終止</span>`;
                        else if (i.status === 2) statusHtml = `<span style="background:#fffbeb; color:#d97706; border:1px solid #fef3c7; font-size:0.75rem; font-weight:800; padding:2px 6px; border-radius:4px; margin-right:6px;"><i class="fas fa-info-circle"></i> 營運異常</span>`;
                        else if (i.status === 1) statusHtml = `<span style="background:#f0fdf4; color:#16a34a; border:1px solid #dcfce7; font-size:0.75rem; font-weight:800; padding:2px 6px; border-radius:4px; margin-right:6px;"><i class="fas fa-check-circle"></i> 營運正常</span>`;
                    }

                    // 消息類別標籤 (最新消息/營運公告)
                    let catHtml = '';
                    if (i.tag === '消息' && i.category !== undefined) {
                        const catMap = { 1: '最新消息', 2: '新聞稿', 3: '營運資訊', 4: '轉乘資訊', 5: '活動訊息', 6: '系統公告', 7: '通阻資訊', 99: '其他' };
                        const catText = catMap[i.category] || '';
                        if (catText) {
                            catHtml = `<span style="background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; font-size:0.75rem; font-weight:800; padding:2px 6px; border-radius:4px; margin-right:6px;"><i class="fas fa-tag"></i> ${catText}</span>`;
                        }
                    }

                    // 原因與影響標籤
                    let detailsHtml = '';
                    if (i.tag === '通阻') {
                        const causeText = i.cause !== undefined ? causeMap[i.cause] : null;
                        const effectText = i.effect !== undefined ? effectMap[i.effect] : null;
                        if (causeText || effectText) {
                            detailsHtml += `<div style="display:flex; gap:6px; margin:6px 0; flex-wrap:wrap;">`;
                            if (causeText) detailsHtml += `<span style="background:#f1f5f9; color:#475569; font-size:0.7rem; font-weight:700; padding:1px 6px; border-radius:4px; border:1px solid #e2e8f0;"><i class="fas fa-question-circle"></i> 原因: ${causeText}</span>`;
                            if (effectText) detailsHtml += `<span style="background:#f1f5f9; color:#475569; font-size:0.7rem; font-weight:700; padding:1px 6px; border-radius:4px; border:1px solid #e2e8f0;"><i class="fas fa-tools"></i> 影響: ${effectText}</span>`;
                            detailsHtml += `</div>`;
                        }
                    }

                    // 聯絡電話與網頁連結 (最新消息)
                    let newsMetaHtml = '';
                    if (i.tag === '消息' && (i.phone || i.newsUrl || i.attachmentUrl)) {
                        newsMetaHtml += `<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">`;
                        if (i.phone) {
                            newsMetaHtml += `<a href="tel:${i.phone}" style="color:#2563eb; text-decoration:none; font-weight:bold; font-size:0.75rem; background:#eff6ff; padding:4px 8px; border-radius:6px; border:1px solid #bfdbfe;"><i class="fas fa-phone-alt"></i> 聯絡: ${i.phone}</a>`;
                        }
                        if (i.newsUrl) {
                            newsMetaHtml += `<a href="${i.newsUrl}" target="_blank" style="color:#4b5563; text-decoration:none; font-weight:bold; font-size:0.75rem; background:#f3f4f6; padding:4px 8px; border-radius:6px; border:1px solid #e5e7eb;"><i class="fas fa-external-link-alt"></i> 官方網站</a>`;
                        }
                        if (i.attachmentUrl) {
                            newsMetaHtml += `<a href="${i.attachmentUrl}" target="_blank" style="color:#4b5563; text-decoration:none; font-weight:bold; font-size:0.75rem; background:#f3f4f6; padding:4px 8px; border-radius:6px; border:1px solid #e5e7eb;"><i class="fas fa-paperclip"></i> 附件網址</a>`;
                        }
                        newsMetaHtml += `</div>`;
                    }

                    // 影響範圍 (Scope)
                    let scopeHtml = '';
                    if (i.tag === '通阻' && i.scope) {
                        const scope = i.scope;
                        const affectedRoutes = scope.Routes ? scope.Routes.map(r => r.RouteName?.Zh_tw || r.RouteName || r.RouteID).filter(Boolean) : [];
                        const affectedStops = scope.Stops ? scope.Stops.map(s => s.StopName?.Zh_tw || s.StopName || s.StopID).filter(Boolean) : [];
                        
                        if (affectedRoutes.length > 0 || affectedStops.length > 0) {
                            scopeHtml += `<div style="margin-top:8px; padding:8px 10px; background:#f8fafc; border-radius:8px; border:1px solid #e2e8f0; font-size:0.8rem; color:#64748b; line-height:1.4;">`;
                            if (affectedRoutes.length > 0) scopeHtml += `<div style="margin-bottom:4px;"><i class="fas fa-route"></i> <strong>受影響路線：</strong>${affectedRoutes.join(', ')}</div>`;
                            if (affectedStops.length > 0) scopeHtml += `<div><i class="fas fa-map-marker-alt"></i> <strong>受影響站點：</strong>${affectedStops.join(', ')}</div>`;
                            scopeHtml += `</div>`;
                        }
                    }
                    
                    return `
                    <div style="border-bottom:1px solid #eee; padding-bottom:16px; margin-bottom:4px;">
                        <div style="font-size:0.8rem; color:#9ca3af; margin-bottom:4px;">${i.date ? i.date.substring(0, 10) : ''}</div>
                        <div style="font-weight:700; font-size:1.05rem; margin-bottom:6px; display:flex; align-items:center; flex-wrap:wrap; gap:4px;">
                            <span class="${i.cls}">${i.tag}</span> ${statusHtml} ${catHtml} ${i.title}
                        </div>
                        ${detailsHtml}
                        <div class="news-desc-content" style="line-height:1.5; color:#475569;">${descHtml}</div>
                        ${newsMetaHtml}
                        ${scopeHtml}
                    </div>`;
                }).join('') + '</div>';
        } catch (e) {
            document.getElementById('news-content-area').innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px;">載入失敗</div>`;
        }
    }

    async function updateMarqueeSection(elementId, city, type) {
        const textEl = document.getElementById(elementId);
        if (!textEl) return;
        try {
            const res = await throttledFetch(`${WORKER_URL}/?action=alert&category=${type || 'CityBus'}&city=${city}`);
            const data = await res.json();
            const alerts = Array.isArray(data) ? data.filter(a => a.Status !== 1) : [];
            
            if (alerts.length > 0) {
                const text = alerts.map(a => `【${a.Title}】${a.Description}`).join("　　　");
                textEl.innerText = text;
                textEl.className = 'marquee-content';
                textEl.style.animationDuration = Math.max(10, text.length * 0.1) + 's';
            } else {
                textEl.innerText = "🚍 公車營運正常";
                textEl.className = ''; 
            }
        } catch (e) { textEl.innerText = "暫無資訊"; }
    }
